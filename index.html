<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Droste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Droste Verkauf</title>
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --mut:#6e6e73; --line:#d2d2d7;
  --green:#2e8b3d; --red:#e0381b; --blue:#0071e3; --panel:#e8f2fe;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000; --card:#1c1c1e; --text:#f5f5f7; --mut:#98989d; --line:#38383a; --panel:#10243d}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(80px + env(safe-area-inset-bottom))}
header{background:var(--card);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header img{height:38px;display:block;border-radius:4px;background:#fff}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px}
.datebar input{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);
  font-size:16px;text-align:center;padding:0 8px}
.card{background:var(--card);border-radius:16px;padding:4px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:0}
.row .n{font-weight:600}.row .p{color:var(--mut);font-size:13px}
.ctr{display:flex;align-items:center;gap:6px}
.ctr button{width:44px;height:44px;border-radius:12px;border:0;font-size:24px;background:var(--bg);color:var(--text)}
.ctr button.plus{background:var(--green);color:#fff}
.ctr input{width:56px;height:44px;text-align:center;font-size:20px;font-weight:600;border:0;background:transparent;color:var(--text)}
.sum{display:flex;justify-content:space-between;padding:14px 0;font-weight:700;font-size:18px}
.sum span:last-child{color:var(--blue)}
label.f{display:block;color:var(--mut);font-size:13px;margin:12px 0 4px}
input.t,textarea.t,select.t{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:var(--bg);color:var(--text);font-family:inherit}
textarea.t{min-height:80px}
.pad{padding-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;background:var(--blue);color:#fff;margin:8px 0}
.btn.sec{background:var(--card);color:var(--blue);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.hint{color:var(--mut);font-size:13px;margin:6px 2px 12px}
.warn{background:#fff3e0;color:#8a4b00;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
@media (prefers-color-scheme:dark){.warn{background:#3a2a10;color:#ffb74d}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--panel);color:var(--blue);text-align:left;padding:8px 6px;font-size:12px}
td{padding:8px 6px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--text)}
h2{font-size:20px;margin:16px 0 8px}
.mini{display:flex;gap:8px}.mini>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:12px 4px 10px;font-size:12px;color:var(--mut)}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--blue)}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:#1d1d1f;color:#fff;
  padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.saved.show{opacity:.92}
.edit{display:flex;gap:8px;margin-bottom:8px}.edit input{min-width:0}
.edit .x{flex:none;width:44px;border:0;border-radius:12px;background:var(--bg);color:var(--red);font-size:20px}
</style>
</head>
<body>
<header><img src="logo.jpg" alt="Hof Droste"><div id="hstat" style="font-size:12px;color:var(--mut)"></div></header>
<main id="app"></main>
<nav id="nav">
  <button data-t="erfassen"><b>✎</b>Erfassen</button>
  <button data-t="uebersicht"><b>▤</b>Übersicht</button>
  <button data-t="einstellungen"><b>⚙︎</b>Daten</button>
</nav>
<div class="saved" id="saved">Gespeichert</div>

<script>
const KEY='droste-verkauf-v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8);
const todayStr=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const eur=n=>(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const DEFAULT={
  stands:[
    {id:'media',name:'Media Markt'},{id:'schmidt',name:'Schmidt Ankum'},{id:'kallmeyer',name:'Kallmeyer'},
    {id:'porta',name:'Porta'},{id:'hasbergen',name:'Hasbergen'},{id:'quick',name:'Quick'}],
  products:[
    {id:'p1',name:'Nordmanntanne',price:0},{id:'p2',name:'Blaufichte',price:0},{id:'p3',name:'Fichte',price:0},
    {id:'p4',name:'Sonstiges',price:0}],
  entries:{}, lastExport:0, lastChange:0
};
let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!S||!S.stands)S=JSON.parse(JSON.stringify(DEFAULT));
}
let saveT;
function save(){
  S.lastChange=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Speichern fehlgeschlagen! Bitte sofort exportieren.')}
  const el=$('#saved');el.classList.add('show');clearTimeout(saveT);saveT=setTimeout(()=>el.classList.remove('show'),900);
}
load();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

let tab='erfassen', cur={stand:null,date:todayStr()};
try{const c=JSON.parse(localStorage.getItem(KEY+'-ui'));if(c&&S.stands.some(s=>s.id===c.stand))cur.stand=c.stand}catch(e){}
if(!cur.stand)cur.stand=S.stands[0].id;
const keyOf=(st,d)=>st+'|'+d;
function entry(st,d,create){
  const k=keyOf(st,d);let e=S.entries[k];
  if(!e&&create){e=S.entries[k]={counts:{},prices:{},rest:'',note:''};S.products.forEach(p=>e.prices[p.id]=p.price)}
  return e;
}
const price=(e,p)=>e.prices&&e.prices[p.id]!=null?e.prices[p.id]:p.price;
const ex=e=>e.extra||[];
const qtyOf=e=>S.products.reduce((a,p)=>a+(+e.counts[p.id]||0),0)+ex(e).length;
const revOf=e=>S.products.reduce((a,p)=>a+(+e.counts[p.id]||0)*price(e,p),0)+ex(e).reduce((a,x)=>a+x.price,0);
const pname=id=>(S.products.find(p=>p.id===id)||{name:'?'}).name;
function recentPrices(pid){
  const seen=[];Object.keys(S.entries).sort().reverse().forEach(k=>ex(S.entries[k]).slice().reverse().forEach(x=>{
    if(x.pid===pid&&!seen.includes(x.price))seen.push(x.price)}));return seen.slice(0,8);
}
function addExtra(pid,pr){
  const e=entry(cur.stand,cur.date,true);(e.extra=e.extra||[]).push({id:uid(),pid,price:pr});save();render();
}
function shiftDate(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});

function backupWarn(){
  const hasData=Object.keys(S.entries).length>0;
  if(!hasData)return '';
  const age=Date.now()-(S.lastExport||0);
  if(age>24*3600e3&&S.lastChange>S.lastExport)
    return `<div class="warn">Letztes Backup: ${S.lastExport?Math.floor(age/3600e3)+' Std. her':'noch nie'}. Unter „Daten" exportieren.</div>`;
  return '';
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#hstat').textContent=S.lastExport?'Backup '+new Date(S.lastExport).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'Kein Backup';
  ({erfassen:vErfassen,uebersicht:vUebersicht,einstellungen:vDaten})[tab]();
}

/* ---------- Erfassen ---------- */
function vErfassen(){
  const e=entry(cur.stand,cur.date)||{counts:{},prices:{},rest:'',note:''};
  const rows=S.products.map(p=>`
    <div class="row"><div><div class="n">${esc(p.name)}</div><div class="p">${eur(price(e,p))}</div></div>
    <div class="ctr"><button data-a="minus" data-p="${p.id}">−</button>
    <input type="number" inputmode="numeric" min="0" value="${+e.counts[p.id]||0}" data-a="set" data-p="${p.id}">
    <button class="plus" data-a="plus" data-p="${p.id}">+</button></div></div>`).join('');
  $('#app').innerHTML=`${backupWarn()}
  <div class="chips">${S.stands.map(s=>`<button class="chip ${s.id===cur.stand?'on':''}" data-stand="${s.id}">${esc(s.name)}</button>`).join('')}</div>
  <div class="datebar"><button data-d="-1">‹</button><input type="date" id="date" value="${cur.date}"><button data-d="1">›</button></div>
  <div class="card">${rows}
    <div class="sum"><span>${qtyOf(e)} Stück</span><span>${eur(revOf(e))}</span></div></div>
  <div class="card pad">
    <label class="f">Einzelpreis-Verkauf (z. B. Nordmann mit eigenem Preis)</label>
    <div class="edit"><select class="t" id="xp">${S.products.map(p=>`<option value="${p.id}" ${p.id===cur.xp?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <input class="t" style="width:100px" id="xprice" inputmode="decimal" placeholder="Preis €"></div>
    <button class="btn" id="addX" style="margin-top:0">Verkauf hinzufügen</button>
    ${(()=>{const r=recentPrices(cur.xp||S.products[0].id);return r.length?`<div class="hint">Zuletzt genutzte Preise, Tippen fügt sofort hinzu:</div><div class="chips">${r.map(v=>`<button class="chip" data-xchip="${v}">${eur(v)}</button>`).join('')}</div>`:''})()}
    ${ex(e).map(x=>`<div class="row"><div><div class="n">${esc(pname(x.pid))}</div></div><div class="ctr"><b>${eur(x.price)}</b><button data-delx="${x.id}" style="color:var(--red)">×</button></div></div>`).join('')}
  </div>
  <div class="card pad">
    <label class="f">Restbestand (Stück)</label>
    <input class="t" type="number" inputmode="numeric" id="rest" value="${esc(e.rest)}" placeholder="optional">
    <label class="f">Notiz (Wetter, Besonderheiten, Nachlieferung …)</label>
    <textarea class="t" id="note">${esc(e.note)}</textarea></div>`;
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-a]');if(!t)return;
  if(t.dataset.stand){cur.stand=t.dataset.stand;try{localStorage.setItem(KEY+'-ui',JSON.stringify({stand:cur.stand}))}catch(e){}return render()}
  if(t.id==='addX'){
    const pr=parseFloat(($('#xprice').value||'').replace(',','.'));
    if(!(pr>=0)||$('#xprice').value==='')return alert('Bitte einen Preis eingeben.');
    return addExtra($('#xp').value,pr);
  }
  if(t.dataset.xchip)return addExtra($('#xp').value,parseFloat(t.dataset.xchip));
  if(t.dataset.delx){const e=entry(cur.stand,cur.date);e.extra=ex(e).filter(x=>x.id!==t.dataset.delx);save();return render()}
  if(t.dataset.d){cur.date=shiftDate(cur.date,+t.dataset.d);return render()}
  if(t.dataset.a==='plus'||t.dataset.a==='minus'){
    const e=entry(cur.stand,cur.date,true),p=t.dataset.p;
    e.counts[p]=Math.max(0,(+e.counts[p]||0)+(t.dataset.a==='plus'?1:-1));save();return render();
  }
  if(t.parentElement&&t.parentElement.id==='nav'){tab=t.dataset.t;window.scrollTo(0,0);return render()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='xp'){cur.xp=t.value;return render()}
  if(t.id==='date'&&t.value){cur.date=t.value;return render()}
  if(t.dataset.a==='set'){const e=entry(cur.stand,cur.date,true);e.counts[t.dataset.p]=Math.max(0,parseInt(t.value)||0);save();render()}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='rest'||t.id==='note'){const e=entry(cur.stand,cur.date,true);e[t.id]=t.value;save()}
});

/* ---------- Übersicht ---------- */
function vUebersicht(){
  const byStand=S.stands.map(s=>{
    let q=0,r=0,days=0;
    Object.entries(S.entries).forEach(([k,e])=>{if(k.startsWith(s.id+'|')){const n=qtyOf(e);if(n>0||e.rest!==''){days++}q+=n;r+=revOf(e)}});
    return {s,q,r,days};
  });
  const Q=byStand.reduce((a,x)=>a+x.q,0),R=byStand.reduce((a,x)=>a+x.r,0);
  const dates=[...new Set(Object.keys(S.entries).map(k=>k.split('|')[1]))].sort().reverse().slice(0,14);
  const dayRows=dates.map(d=>{
    let q=0,r=0;S.stands.forEach(s=>{const e=S.entries[keyOf(s.id,d)];if(e){q+=qtyOf(e);r+=revOf(e)}});
    return `<tr><td>${fmtD(d)}</td><td class="r">${q}</td><td class="r">${eur(r)}</td></tr>`}).join('');
  const stand=S.stands.find(s=>s.id===cur.stand);
  const sdates=Object.keys(S.entries).filter(k=>k.startsWith(cur.stand+'|')).map(k=>k.split('|')[1]).sort().reverse();
  const sRows=sdates.map(d=>{const e=S.entries[keyOf(cur.stand,d)];
    return `<tr><td>${fmtD(d)}</td><td class="r">${qtyOf(e)}</td><td class="r">${eur(revOf(e))}</td><td class="r">${esc(e.rest)}</td></tr>`}).join('');
  $('#app').innerHTML=`${backupWarn()}
  <h2>Gesamt</h2>
  <div class="card"><table><tr><th>Stand</th><th class="r">Tage</th><th class="r">Stück</th><th class="r">Umsatz</th></tr>
  ${byStand.map(x=>`<tr><td>${esc(x.s.name)}</td><td class="r">${x.days}</td><td class="r">${x.q}</td><td class="r">${eur(x.r)}</td></tr>`).join('')}
  <tr class="tot"><td>Summe</td><td></td><td class="r">${Q}</td><td class="r">${eur(R)}</td></tr></table></div>
  <h2>Letzte Tage (alle Stände)</h2>
  <div class="card"><table><tr><th>Tag</th><th class="r">Stück</th><th class="r">Umsatz</th></tr>${dayRows||'<tr><td colspan=3>Noch keine Daten</td></tr>'}</table></div>
  <h2>${esc(stand.name)}: Verlauf</h2>
  <div class="chips">${S.stands.map(s=>`<button class="chip ${s.id===cur.stand?'on':''}" data-stand="${s.id}">${esc(s.name)}</button>`).join('')}</div>
  <div class="card"><table><tr><th>Tag</th><th class="r">Stück</th><th class="r">Umsatz</th><th class="r">Rest</th></tr>${sRows||'<tr><td colspan=4>Noch keine Daten</td></tr>'}</table></div>`;
}

/* ---------- Daten / Einstellungen ---------- */
function vDaten(){
  $('#app').innerHTML=`${backupWarn()}
  <h2>Backup</h2>
  <div class="card pad"><div class="hint">Täglich abends exportieren und per „Sichern" in iCloud Drive, Mail oder AirDrop ablegen.</div>
  <button class="btn" id="bJson">Backup sichern (JSON)</button>
  <button class="btn sec" id="bCsv">Excel-Export (CSV)</button>
  <button class="btn sec" id="bImp">Backup einspielen …</button>
  <input type="file" id="fImp" accept=".json,application/json" hidden></div>
  <h2>Produkte & Preise</h2>
  <div class="card pad"><div class="hint">Preis gilt ab dem Moment, in dem ein Tag angelegt wird. Alte Tage behalten ihren Preis.</div>
  ${S.products.map(p=>`<div class="edit"><input class="t" data-pn="${p.id}" value="${esc(p.name)}">
    <input class="t" style="width:90px" inputmode="decimal" data-pp="${p.id}" value="${String(p.price).replace('.',',')}">
    <button class="x" data-del-p="${p.id}">×</button></div>`).join('')}
  <button class="btn sec" id="addP">+ Produkt</button></div>
  <h2>Stände</h2>
  <div class="card pad">
  ${S.stands.map(s=>`<div class="edit"><input class="t" data-sn="${s.id}" value="${esc(s.name)}"></div>`).join('')}
  <button class="btn sec" id="addS">+ Stand</button></div>
  <h2>Gefahrenzone</h2>
  <div class="card pad"><button class="btn red" id="reset">Alle Daten löschen</button></div>
  <div class="hint" style="text-align:center">Alle Daten liegen nur auf diesem Gerät.</div>`;
}
function download(name,type,content){
  const blob=new Blob([content],{type});
  const file=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(()=>1).catch(()=>1);return true;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();return true;
}
function csv(){
  const L=['Datum;Stand;Produkt;Anzahl;Preis;Umsatz;Restbestand;Notiz'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""').replace(/\n/g,' ')+'"';
  const nf=n=>String(n).replace('.',',');
  Object.keys(S.entries).sort().forEach(k=>{
    const [sid,d]=k.split('|'),e=S.entries[k],st=S.stands.find(s=>s.id===sid);
    const act=S.products.filter(p=>+e.counts[p.id]>0);
    ex(e).forEach(x=>L.push([d,q(st?st.name:sid),q(pname(x.pid)+' (Einzelpreis)'),1,nf(x.price),nf(x.price),'',''].join(';')));
    (act.length?act:(ex(e).length&&!e.rest&&!e.note?[]:[null])).forEach((p,i)=>{
      L.push([d,q(st?st.name:sid),p?q(p.name):'',p?e.counts[p.id]:0,p?nf(price(e,p)):'',p?nf(+e.counts[p.id]*price(e,p)):0,
        i===0?e.rest:'',i===0?q(e.note):''].join(';'));
    });
  });
  return '﻿'+L.join('\r\n');
}
document.addEventListener('click',ev=>{
  const id=ev.target.id;if(!id&&!ev.target.dataset.delP)return;
  const stamp=todayStr();
  if(id==='bJson'){S.lastExport=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    download(`${stamp}_Droste-Backup.json`,'application/json',JSON.stringify(S));render()}
  if(id==='bCsv'){S.lastExport=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    download(`${stamp}_Droste-Verkauf.csv`,'text/csv;charset=utf-8',csv());render()}
  if(id==='bImp')$('#fImp').click();
  if(id==='addP'){S.products.push({id:'p'+uid(),name:'Neu',price:0});save();render()}
  if(id==='addS'){S.stands.push({id:'s'+uid(),name:'Neuer Stand'});save();render()}
  if(ev.target.dataset.delP){
    const p=S.products.find(x=>x.id===ev.target.dataset.delP);
    if(confirm(`„${p.name}" entfernen? Bereits erfasste Zahlen dazu gehen in der Übersicht verloren.`)){S.products=S.products.filter(x=>x!==p);save();render()}
  }
  if(id==='reset'&&confirm('Wirklich ALLE Daten löschen? Vorher Backup sichern!')&&confirm('Sicher? Das kann nicht rückgängig gemacht werden.')){
    S=JSON.parse(JSON.stringify(DEFAULT));save();render()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='fImp'&&t.files[0]){
    const r=new FileReader();r.onload=()=>{try{
      const d=JSON.parse(r.result);if(!d.stands||!d.products||!d.entries)throw 0;
      if(confirm('Aktuelle Daten durch dieses Backup ersetzen?')){S=d;save();cur.stand=S.stands[0].id;render()}
    }catch(e){alert('Keine gültige Backup-Datei.')}};r.readAsText(t.files[0]);
  }
  if(t.dataset.pn){S.products.find(p=>p.id===t.dataset.pn).name=t.value||'?';save()}
  if(t.dataset.pp){S.products.find(p=>p.id===t.dataset.pp).price=parseFloat(t.value.replace(',','.'))||0;save()}
  if(t.dataset.sn){S.stands.find(s=>s.id===t.dataset.sn).name=t.value||'?';save()}
});

render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Droste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Droste Verkauf</title>
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --mut:#6e6e73; --line:#d2d2d7;
  --green:#2e8b3d; --red:#e0381b; --blue:#0071e3; --panel:#e8f2fe; --orange:#e67e22;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000; --card:#1c1c1e; --text:#f5f5f7; --mut:#98989d; --line:#38383a; --panel:#10243d}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:var(--card);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header img{height:38px;display:block;border-radius:4px;background:#fff}
#prof{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--text);padding:2px;text-align:left;font:inherit}
#prof b{display:block;font-size:14px;line-height:1.1}
#prof small{display:block;font-size:11px;color:var(--mut);line-height:1.2}
#av{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal u{text-decoration:none;text-align:center;font-size:11px;color:var(--mut);padding-bottom:2px}
.cd{height:46px;border:1px solid transparent;border-radius:10px;background:var(--bg);color:var(--text);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit}
.cd b{font-size:14px;font-weight:600}.cd span{height:7px;display:flex;gap:3px}
.cd.sel{background:var(--blue);color:#fff}.cd.today{border-color:var(--blue)}
em.d{display:inline-block;width:6px;height:6px;border-radius:50%;font-style:normal}
.d.b{background:var(--blue)}.d.r{background:var(--red)}.d.g{background:var(--green)}.d.x{background:var(--line)}
.cd.sel .d.b{background:#fff}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;color:#fff;font-size:15px;padding:0}
.chk.on{background:var(--green);border-color:var(--green)}
.done{text-decoration:line-through;color:var(--mut)}
.dim{opacity:.6}
.sug{background:var(--panel);border-radius:12px;padding:10px;margin-top:8px;font-size:14px}.sug small{color:var(--mut)}
.tbanner{background:var(--panel);color:var(--blue);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.wheels{display:flex;gap:8px;margin-bottom:8px}
.wcol{flex:1;position:relative}
.wheel{height:150px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:55px 0;background:var(--bg);border-radius:12px;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font-size:22px;font-weight:600;color:var(--mut);cursor:pointer}
.band{position:absolute;left:4px;right:4px;top:55px;height:40px;border-radius:10px;background:rgba(0,113,227,.14);border:1px solid rgba(0,113,227,.4);pointer-events:none}
main{max-width:600px;margin:0 auto;padding:12px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px}
.datebar input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);
  font-size:16px;text-align:center;padding:0 8px}
.card{background:var(--card);border-radius:16px;padding:4px 16px;margin-bottom:12px;overflow:hidden}
.card.pad{padding:12px 16px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:0}
.row .n{font-weight:600}.row .p{color:var(--mut);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid rgba(0,0,0,.2)}
.ctr{display:flex;align-items:center;gap:4px}
.ctr button{width:42px;height:42px;border-radius:12px;border:0;font-size:24px;background:var(--bg);color:var(--text)}
.ctr button.plus{background:var(--green);color:#fff}
.ctr input{width:46px;height:42px;text-align:center;font-size:19px;font-weight:600;border:0;background:transparent;color:var(--text)}
.sum{display:flex;justify-content:space-between;padding:14px 0;font-weight:700;font-size:18px}
.sum span:last-child{color:var(--blue)}
label.f{display:block;color:var(--mut);font-size:13px;margin:12px 0 4px}
label.f:first-child{margin-top:0}
input.t,textarea.t,select.t{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:16px;background:var(--bg);color:var(--text);font-family:inherit}
textarea.t{min-height:76px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:600;background:var(--blue);color:#fff;margin:8px 0}
.btn.sec{background:var(--card);color:var(--blue);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn.green{background:var(--green)}
.hint{color:var(--mut);font-size:13px;margin:6px 2px 8px}
.warn{background:#fff3e0;color:#8a4b00;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
@media (prefers-color-scheme:dark){.warn{background:#3a2a10;color:#ffb74d}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--panel);color:var(--blue);text-align:left;padding:8px 6px;font-size:12px}
td{padding:8px 6px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--text)}
h2{font-size:20px;margin:18px 0 8px;letter-spacing:-.01em}
h3{font-size:15px;margin:14px 0 4px;color:var(--mut);font-weight:600}
.mini{display:flex;gap:8px}.mini>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:10px 2px 8px;font-size:11px;color:var(--mut)}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--blue)}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#1d1d1f;color:#fff;
  padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.saved.show{opacity:.92}
.edit{display:flex;gap:8px;margin-bottom:8px;align-items:center}.edit input{min-width:0}
.edit .x{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--bg);color:var(--red);font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:var(--card);border-radius:16px;padding:12px 14px}
.tile small{display:block;color:var(--mut);font-size:12px}
.tile b{font-size:22px;letter-spacing:-.02em}
.tile.g b{color:var(--green)}.tile.r b{color:var(--red)}.tile.b b{color:var(--blue)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}.kv span:last-child{font-weight:600}
.kv.hl{font-weight:700;background:var(--panel);margin:0 -16px;padding:9px 16px}
.neg{color:var(--red)}.pos{color:var(--green)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.hb .l{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{flex:1;background:var(--bg);border-radius:6px;height:20px;position:relative;overflow:hidden}
.hb .bar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.hb .v{width:78px;flex:none;text-align:right;font-weight:600}
svg text{fill:var(--mut);font-size:10px;font-family:inherit}
svg .val{fill:var(--text)}
.qrow{border-bottom:1px solid var(--line);padding:8px 0}.qrow:last-child{border-bottom:0}
.qrow small{color:var(--mut);display:block;margin-bottom:4px}
.qrow.amb small{color:var(--orange)}
.qrow .edit{margin:0}
</style>
</head>
<body>
<header><img src="logo.jpg" alt="Hof Droste"><button id="prof" aria-label="Benutzerprofil"><span id="av"></span><span><b id="pname"></b><small id="hstat"></small></span></button></header>
<main id="app"></main>
<nav id="nav">
  <button data-t="erfassen"><b>✎</b>Erfassen</button>
  <button data-t="plan"><b>◫</b>Plan<span id="pbadge"></span></button>
  <button data-t="stand"><b>▦</b>Stand</button>
  <button data-t="gesamt"><b>▤</b>Gesamt</button>
  <button data-t="einstellungen"><b>⚙︎</b>Daten</button>
</nav>
<div class="saved" id="saved">Gespeichert</div>

<script>
const KEY='droste-verkauf-v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8);
const todayStr=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const eur=n=>(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const eur0=n=>(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const num=n=>(n||0).toLocaleString('de-DE');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pf=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?0:x};

const mkStand=(id,name)=>({id,name,fee:0,staff:0,setup:0,freight:0});
const DEFAULT=()=>({
  v:2,user:'Till',
  stands:[mkStand('media','Media Markt'),mkStand('schmidt','Schmidt Ankum'),mkStand('kallmeyer','Kallmeyer'),
          mkStand('porta','Porta'),mkStand('hasbergen','Hasbergen'),mkStand('quick','Quick')],
  products:[
    {id:'p1',name:'Nordmann Holzscheibe',price:20,cost:0},
    {id:'p2',name:'Nordmann Topf',price:18,cost:0},
    {id:'p3',name:'Blaufichte',price:0,cost:0},
    {id:'p4',name:'Nobilis Handbund',price:3,cost:0},
    {id:'p5',name:'Nobilis 2,5kg',price:7,cost:0},
    {id:'p6',name:'Nordmann Handbund',price:3,cost:0},
    {id:'p7',name:'Nordmann 2,5kg',price:6,cost:0},
    {id:'p8',name:'Nordmann 17 €',price:17,cost:0},
    {id:'p9',name:'Nordmann Blau',price:20,cost:6,color:'#1ea7e8'},
    {id:'p10',name:'Nordmann Gelb',price:27,cost:8,color:'#ffe600'},
    {id:'p11',name:'Nordmann Orange',price:35,cost:10,color:'#f0a07c'},
    {id:'p12',name:'Nordmann Grün',price:40,cost:14,color:'#8fce3c'},
    {id:'p13',name:'Nordmann Lila/Gelb',price:45,cost:0,color:'#d96cc8'},
    {id:'p14',name:'Nordmann Lila',price:45,cost:7,color:'#b04fd6'},
    {id:'p15',name:'Nordmann Rot',price:25,cost:13,color:'#ff2d2d'},
    {id:'p16',name:'Nordmann 25 €',price:25,cost:0},
    {id:'p17',name:'Nordmann 26 €',price:26,cost:0},
    {id:'f1',name:'Nordmann (Einzelpreis)',price:0,cost:0,free:true}],
  entries:{}, moves:[], tasks:[], notes:[], people:['Till'], lastExport:0, lastChange:0
});
let S;
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);S=JSON.parse(raw)}catch(e){S=null}
  if(!S||S.v!==2){
    if(raw){try{localStorage.setItem(KEY+'-v1-alt',raw)}catch(e){}}
    S=DEFAULT();
  }
}
let saveT;
function save(){
  S.lastChange=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Speichern fehlgeschlagen! Bitte sofort exportieren.')}
  const el=$('#saved');el.classList.add('show');clearTimeout(saveT);saveT=setTimeout(()=>el.classList.remove('show'),900);
}
load();
S.tasks=S.tasks||[];S.notes=S.notes||[];S.people=(S.people&&S.people.length)?S.people:[S.user||'Till'];
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

let tab='erfassen', cur={stand:null,date:todayStr(),xp:null,parsed:null,qtext:'',ptab:'kal',cal:todayStr().slice(0,7),cday:todayStr(),pf:'',tfOpen:false,ntext:'',tf:null};
try{const c=JSON.parse(localStorage.getItem(KEY+'-ui'));if(c&&S.stands.some(s=>s.id===c.stand))cur.stand=c.stand}catch(e){}
if(!cur.stand)cur.stand=S.stands[0].id;
const keyOf=(st,d)=>st+'|'+d;
const prod=id=>S.products.find(p=>p.id===id);
const pname=id=>(prod(id)||{name:'?'}).name;
function entry(st,d,create){
  const k=keyOf(st,d);let e=S.entries[k];
  if(!e&&create){e=S.entries[k]={counts:{},prices:{},extra:[],rest:'',note:''};S.products.forEach(p=>e.prices[p.id]=p.price)}
  if(e&&!e.extra)e.extra=[];
  return e;
}
const price=(e,p)=>e.prices&&e.prices[p.id]!=null?e.prices[p.id]:p.price;
const exq=x=>x.qty||1;
const qtyOf=e=>S.products.reduce((a,p)=>a+(+e.counts[p.id]||0),0)+(e.extra||[]).reduce((a,x)=>a+exq(x),0);
const revOf=e=>S.products.reduce((a,p)=>a+(+e.counts[p.id]||0)*price(e,p),0)+(e.extra||[]).reduce((a,x)=>a+x.price*exq(x),0);
const costOf=e=>S.products.reduce((a,p)=>a+(+e.counts[p.id]||0)*(p.cost||0),0)+(e.extra||[]).reduce((a,x)=>a+exq(x)*((prod(x.pid)||{}).cost||0),0);
function prodQty(e,acc){
  S.products.forEach(p=>{const c=+e.counts[p.id]||0;if(c)acc[p.id]=(acc[p.id]||0)+c});
  (e.extra||[]).forEach(x=>acc[x.pid]=(acc[x.pid]||0)+exq(x));
}
const shiftDate=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
const shortD=d=>d.slice(8)+'.'+d.slice(5,7)+'.';
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];

/* ---------- Auswertung ---------- */
function stats(sids){
  sids=[].concat(sids);
  const R={verk:0,umsatz:0,pcost:0,lief:0,ret:0,fee:0,staff:0,setup:0,freight:0,byDay:{},byProd:{},byWd:[0,0,0,0,0,0,0],ist:null,istDate:'',dayMoves:{}};
  const dset=new Set();
  sids.forEach(sid=>{
    const st=S.stands.find(s=>s.id===sid)||{};
    ['fee','staff','setup','freight'].forEach(k=>R[k]+=(+st[k]||0));
    let latest='';
    Object.keys(S.entries).forEach(k=>{
      const [s,d]=k.split('|');if(s!==sid)return;
      const e=entry(s,d),q=qtyOf(e),r=revOf(e);
      R.verk+=q;R.umsatz+=r;R.pcost+=costOf(e);
      const o=R.byDay[d]||(R.byDay[d]={q:0,r:0});o.q+=q;o.r+=r;dset.add(d);
      R.byWd[new Date(d+'T12:00:00').getDay()]+=r;
      prodQty(e,R.byProd);
      if(e.rest!==''&&e.rest!=null&&d>=latest){latest=d;R.istSid=R.istSid||{};R.istSid[sid]={d,v:parseInt(e.rest)||0}}
    });
    S.moves.forEach(m=>{if(m.stand!==sid)return;
      const o=R.dayMoves[m.date]||(R.dayMoves[m.date]={l:0,r:0});
      if(m.type==='L'){R.lief+=m.qty;o.l+=m.qty}else{R.ret+=m.qty;o.r+=m.qty}dset.add(m.date)});
  });
  if(R.istSid){const v=Object.values(R.istSid);R.ist=v.reduce((a,x)=>a+x.v,0);R.istAll=v.length===sids.length}
  R.fixed=R.fee+R.staff+R.setup+R.freight;
  R.gewinn=R.umsatz-R.pcost-R.fixed;
  R.soll=R.lief-R.ret-R.verk;
  R.diff=R.ist==null?null:R.ist-R.soll;
  R.dates=[...dset].sort();
  let cum=0;
  R.bestand=R.dates.map(d=>{const q=(R.byDay[d]||{q:0}).q,m=R.dayMoves[d]||{l:0,r:0};cum+=m.l-m.r-q;return {l:shortD(d),v:cum}});
  R.days=R.dates.filter(d=>R.byDay[d]).length;
  const sd=R.dates.filter(d=>R.byDay[d]&&R.byDay[d].q>0);
  R.avg=sd.length?R.verk/sd.length:0;
  const last3=sd.slice(-3);R.avg3=last3.length?last3.reduce((a,d)=>a+R.byDay[d].q,0)/last3.length:0;
  R.best=sd.reduce((b,d)=>!b||R.byDay[d].r>R.byDay[b].r?d:b,null);
  return R;
}

/* ---------- Diagramme (SVG) ---------- */
function barChart(items,o={}){
  if(!items.length)return '<div class="hint">Noch keine Daten.</div>';
  const H=o.h||130,bw=o.bw||30,W=Math.max(300,items.length*bw+16),pad=32,col=o.color||'var(--blue)';
  const max=Math.max(...items.map(i=>i.v),1);
  const bars=items.map((it,i)=>{
    const h=Math.max(0,(it.v/max)*(H-pad-4)),x=8+i*bw,y=H-h-14;
    return `<rect x="${x+3}" y="${y}" width="${bw-8}" height="${h}" rx="4" fill="${col}"/>
      <text class="val" x="${x+bw/2-1}" y="${y-3}" text-anchor="middle">${o.fmt?o.fmt(it.v):it.v}</text>
      <text x="${x+bw/2-1}" y="${H-2}" text-anchor="middle">${it.l}</text>`}).join('');
  return `<div class="scroll"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bars}</svg></div>`;
}
function lineChart(items,o={}){
  if(!items.length)return '<div class="hint">Noch keine Daten.</div>';
  const H=o.h||140,bw=o.bw||34,W=Math.max(300,items.length*bw+24),top=14,bot=18;
  const vs=items.map(i=>i.v),mx=Math.max(...vs,0),mn=Math.min(...vs,0),rng=(mx-mn)||1;
  const Y=v=>top+(mx-v)/rng*(H-top-bot),X=i=>16+i*bw;
  const pts=items.map((it,i)=>`${X(i)},${Y(it.v)}`).join(' ');
  const dots=items.map((it,i)=>`<circle cx="${X(i)}" cy="${Y(it.v)}" r="3.5" fill="${it.v<0?'var(--red)':'var(--green)'}"/>
    <text class="val" x="${X(i)}" y="${Y(it.v)-7}" text-anchor="middle">${it.v}</text>
    <text x="${X(i)}" y="${H-3}" text-anchor="middle">${it.l}</text>`).join('');
  return `<div class="scroll"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="4 3"/>
    <polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg></div>`;
}
function hbars(rows,fmt){
  if(!rows.length)return '<div class="hint">Noch keine Daten.</div>';
  const max=Math.max(...rows.map(r=>r.v),1);
  return rows.map(r=>`<div class="hb"><div class="l">${esc(r.l)}</div><div class="bar"><i style="width:${Math.max(2,r.v/max*100)}%"></i></div><div class="v">${fmt?fmt(r.v):r.v}</div></div>`).join('');
}

/* ---------- Rahmen ---------- */
function backupWarn(){
  if(!Object.keys(S.entries).length&&!S.moves.length)return '';
  const age=Date.now()-(S.lastExport||0);
  if(age>24*3600e3&&S.lastChange>S.lastExport)
    return `<div class="warn">Letztes Backup: ${S.lastExport?Math.floor(age/3600e3)+' Std. her':'noch nie'}. Unter „Daten" exportieren.</div>`;
  return '';
}
const standChips=()=>`<div class="chips">${S.stands.map(s=>`<button class="chip ${s.id===cur.stand?'on':''}" data-stand="${s.id}">${esc(s.name)}</button>`).join('')}</div>`;
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#pname').textContent=S.user||'Till';$('#av').textContent=(S.user||'Till').trim().charAt(0).toUpperCase();
  $('#hstat').textContent=S.lastExport?'Backup '+new Date(S.lastExport).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'Kein Backup';
  const oc=openCount();$('#pbadge').textContent=oc?' ('+oc+')':'';
  ({erfassen:vErfassen,plan:vPlan,stand:vStand,gesamt:vGesamt,einstellungen:vDaten})[tab]();
}

/* ---------- Drehrad ---------- */
const WH=40;
const wheelHtml=(id,min,max,val)=>`<div class="wcol"><div class="wheel" id="${id}" data-min="${min}" data-max="${max}" data-val="${val}">${Array.from({length:max-min+1},(_,i)=>`<div data-v="${min+i}">${min+i}</div>`).join('')}</div><i class="band"></i></div>`;
const wheelVal=el=>{const mn=+el.dataset.min,mx=+el.dataset.max;return Math.min(mx,Math.max(mn,mn+Math.round(el.scrollTop/WH)))};
function setWheel(el,v){el.scrollTop=(Math.min(+el.dataset.max,Math.max(+el.dataset.min,v))-el.dataset.min)*WH}
function updateAdd(){
  const wp=$('#wp'),wq=$('#wq'),b=$('#addX');if(!wp||!wq||!b)return;
  cur.wp=wheelVal(wp);cur.wq=wheelVal(wq);
  b.textContent=`${cur.wq} × ${eur(cur.wp)} hinzufügen (${eur(cur.wp*cur.wq)})`;
}
function initWheels(){
  document.querySelectorAll('.wheel').forEach(el=>{
    setWheel(el,+el.dataset.val);
    el.addEventListener('scroll',updateAdd,{passive:true});
    el.addEventListener('click',ev=>{const d=ev.target.closest('[data-v]');if(d)el.scrollTo({top:(+d.dataset.v-el.dataset.min)*WH,behavior:'smooth'})});
  });
  updateAdd();requestAnimationFrame(()=>{document.querySelectorAll('.wheel').forEach(el=>setWheel(el,+el.dataset.val));updateAdd()});
}

  $('#app').innerHTML=`${backupWarn()}${todayBanner()}${standChips()}

    <textarea class="t" id="qtext" placeholder="Liste vom Papier hier eintippen oder diktieren">${esc(cur.qtext)}</textarea>
    <button class="btn" id="qParse" style="margin-bottom:0">Auslesen</button>${parsed}</div>
  <div class="card">${rows}
    <div class="sum"><span>${qtyOf(e)} Stück</span><span>${eur(revOf(e))}</span></div></div>
  <div class="card pad">
    <label class="f">Einzelpreis-Verkauf (Baum mit eigenem Preis)</label>
    <div class="edit"><select class="t" id="xp">${S.products.map(p=>`<option value="${p.id}" ${p.id===cur.xp?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
</div>
    <div style="display:flex;gap:8px;font-size:12px;color:var(--mut);margin:2px 4px"><span style="flex:1;text-align:center">Menge</span><span style="flex:1;text-align:center">Preis €</span></div>
    <div class="wheels">${wheelHtml('wq',1,100,cur.wq)}${wheelHtml('wp',15,100,cur.wp)}</div>

    ${(e.extra||[]).map(x=>`<div class="row"><div><div class="n">${esc(pname(x.pid))}</div><div class="p">${exq(x)} × ${eur(x.price)}</div></div><div class="ctr"><b>${eur(x.price*exq(x))}</b><button data-delx="${x.id}" style="color:var(--red)">×</button></div></div>`).join('')}
  </div>

/* Schnell-Erfassung: Text -> Zeilen */
const normT=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss')
  .replace(/(\d)[.,](\d)\s*kg/g,'$1$2kg').replace(/[^a-z0-9€\s]/g,' ').replace(/\s+/g,' ').trim();
const tokMatch=(a,b)=>a===b||(a.length>=4&&b.length>=4&&Math.abs(a.length-b.length)<=2&&(a.startsWith(b)||b.startsWith(a)));
const ptoks=p=>normT(p.name).split(' ').filter(t=>t&&t!=='€');
function parseSeg(seg){
  let raw=seg.replace(/(\d)[.,](\d)\s*kg/gi,'$1$2kg'),pr=null,cnt=null;
  const pm=raw.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur\b|euro\b)/i);
  if(pm){pr=pf(pm[1]);raw=raw.replace(pm[0],' ')}
  const cm=raw.match(/(\d+)\s*(?:x\b|mal\b|stk\b|stück|stueck|st\b)/i)||raw.match(/\bx\s*(\d+)/i);
  if(cm){cnt=+cm[1];raw=raw.replace(cm[0],' ')}
  else{
    const ints=[...raw.matchAll(/(?<![\w])\d+(?![\w])/g)].map(m=>m[0]);
    if(ints.length){
      cnt=+ints[ints.length-1];
      if(pr==null&&ints.length>=2)pr=+ints[0];
      ints.forEach(n=>{raw=raw.replace(new RegExp('(?<![\\w])'+n+'(?![\\w])'),' ')});
    }
  }
  if(cnt==null)cnt=1;
  const toks=normT(raw).split(' ').filter(t=>t&&!['mal','x','stk','stuck','st','€','euro','eur','je','a','à','und'].includes(t));
  let cands=toks.length?S.products.filter(p=>{const pt=ptoks(p);return toks.every(t=>pt.some(b=>tokMatch(t,b)))}):[];
  let amb=false,pid='';
  let freeHit=false;
  if(pr!=null){const f=cands.filter(p=>Math.abs(p.price-pr)<0.005&&!p.free);if(f.length)cands=f;else{const fr=cands.filter(p=>p.free);if(fr.length){cands=fr;freeHit=true}}}
  cands.sort((a,b)=>ptoks(a).length-ptoks(b).length);
  if(cands.length){
    pid=cands[0].id;
    if(!freeHit&&cands.length>1&&ptoks(cands[1]).length===ptoks(cands[0]).length&&!(pr!=null&&cands.filter(p=>Math.abs(p.price-pr)<0.005).length===1))amb=true;
  }else amb=true;
  const p=prod(pid);
  return {txt:seg.trim(),pid,price:pr!=null?pr:(p?p.price:0),count:cnt,amb};
}
const parseText=t=>t.split(/\s*(?:[\n;]+|,(?!\d)|(?<!\d),)\s*/).map(s=>s.trim()).filter(Boolean).map(parseSeg);
function addExtra(pid,pr,qty){
  const e=entry(cur.stand,cur.date,true);
  const ex=e.extra.find(x=>x.pid===pid&&Math.abs(x.price-pr)<0.005);
  if(ex)ex.qty=exq(ex)+qty;else e.extra.push({id:uid(),pid,price:pr,qty});
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-a]');if(!t)return;
  if(t.dataset.stand){cur.stand=t.dataset.stand;try{localStorage.setItem(KEY+'-ui',JSON.stringify({stand:cur.stand}))}catch(e){}return render()}
  if(t.id==='prof'||t.closest('#prof')){const n=prompt('Name des Benutzers:',S.user||'Till');if(n&&n.trim()){S.user=n.trim();save();render()}return}
  if(t.id==='qParse'){cur.qtext=$('#qtext').value;cur.parsed=parseText(cur.qtext);if(!cur.parsed.length)alert('Nichts erkannt.');return render()}
  if(t.id==='qCancel'){cur.parsed=null;return render()}
  if(t.id==='qApply'){
    const e=entry(cur.stand,cur.date,true);
    cur.parsed.forEach(r=>{const p=prod(r.pid);if(!p||!(r.count>0))return;
      if(Math.abs(r.price-p.price)<0.005)e.counts[p.id]=(+e.counts[p.id]||0)+r.count;else addExtra(p.id,r.price,r.count)});
    cur.parsed=null;cur.qtext='';save();return render();
  }
  if(t.id==='addX'){
    const pr=wheelVal($('#wp')),qt=wheelVal($('#wq'));
    addExtra($('#xp').value,pr,qt);cur.wp=pr;cur.wq=1;save();return render();
  }
  if(t.dataset.xchip){const v=Math.round(parseFloat(t.dataset.xchip));cur.wp=Math.min(100,Math.max(15,v));setWheel($('#wp'),cur.wp);updateAdd();return}
  if(t.dataset.delx){const e=entry(cur.stand,cur.date);e.extra=e.extra.filter(x=>x.id!==t.dataset.delx);save();return render()}
  if(t.dataset.mv){
    const q=parseInt($('#mqty').value);if(!(q>0))return alert('Bitte Anzahl eingeben.');
    S.moves.push({id:uid(),stand:cur.stand,date:cur.date,type:t.dataset.mv,qty:q});save();return render();
  }
  if(t.dataset.delm){S.moves=S.moves.filter(m=>m.id!==t.dataset.delm);save();return render()}
  if(t.dataset.d){cur.date=shiftDate(cur.date,+t.dataset.d);return render()}
  if(t.dataset.a==='plus'||t.dataset.a==='minus'){
    const e=entry(cur.stand,cur.date,true),p=t.dataset.p;
    e.counts[p]=Math.max(0,(+e.counts[p]||0)+(t.dataset.a==='plus'?1:-1));save();return render();
  }
  if(t.parentElement&&t.parentElement.id==='nav'){tab=t.dataset.t;window.scrollTo(0,0);return render()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='xp'){cur.xp=t.value;return render()}
  if(t.id==='date'&&t.value){cur.date=t.value;return render()}
  if(t.dataset.a==='set'){const e=entry(cur.stand,cur.date,true);e.counts[t.dataset.p]=Math.max(0,parseInt(t.value)||0);save();render()}
  if(t.dataset.qi!=null){
    const r=cur.parsed[+t.dataset.qi],f=t.dataset.qf;
    if(f==='pid'){r.pid=t.value;const p=prod(t.value);if(p)r.price=p.price;r.amb=false;render()}
    else if(f==='price')r.price=pf(t.value);
    else r.count=Math.max(0,parseInt(t.value)||0);
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='qtext')cur.qtext=t.value;
  if(t.id==='rest'||t.id==='note'){const e=entry(cur.stand,cur.date,true);e[t.id]=t.value;save()}
});

/* ---------- Plan: Kalender, Aufgaben, Notizen ---------- */
/* Datenhaltung: S.tasks, S.notes, S.people. Später durch gemeinsamen Cloud-Speicher ersetzbar. */
const newTf=date=>({id:null,title:'',date:date||'',time:'',person:(S.people&&S.people[0])||'',stand:'',type:'todo',noteId:null});
cur.tf=newTf(cur.cday);
const wdD=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
const p2=n=>String(n).padStart(2,'0');
const standNm=id=>{const x=S.stands.find(s=>s.id===id);return x?x.name:''};
function openCount(){const t=todayStr();return S.tasks.filter(x=>!x.done&&x.date&&x.date<=t).length}
function todayBanner(){const n=openCount();return n?`<div class="tbanner" data-pl="goto" data-v="aufg">${n} Aufgabe${n>1?'n':''} heute oder überfällig →</div>`:''}
function salesByDate(){const o={};Object.keys(S.entries).forEach(k=>{const [sid,d]=k.split('|'),e=entry(sid,d),q=qtyOf(e);if(q>0){const x=o[d]||(o[d]={q:0,r:0});x.q+=q;x.r+=revOf(e)}});return o}
function taskRow(t,showDate){
  const over=!t.done&&t.date&&t.date<todayStr();
  const meta=[showDate&&t.date?wdD(t.date):'',t.time,t.person,standNm(t.stand)].filter(Boolean).join(' · ');
  return `<div class="row"><div style="display:flex;gap:10px;align-items:center;min-width:0;flex:1">
    <button class="chk ${t.done?'on':''}" data-pl="tdone" data-v="${t.id}">${t.done?'✓':''}</button>
    <div style="min-width:0;flex:1" data-pl="tedit" data-v="${t.id}"><div class="n ${t.done?'done':''}">${t.type==='termin'?'◷ ':''}${esc(t.title)}</div>
    <div class="p ${over?'neg':''}">${esc(meta)||'&nbsp;'}</div></div></div></div>`;
}
function taskForm(){
  const f=cur.tf,sel=(a,b)=>a===b?'selected':'';
  return `<div class="card pad">
    <label class="f">${f.id?'Eintrag bearbeiten':f.noteId?'Notiz zu Aufgabe machen':'Neuer Eintrag'}</label>
    <input class="t" id="tf-title" placeholder="Was ist zu tun?" value="${esc(f.title)}">
    <div class="mini" style="margin-top:8px"><input class="t" type="date" id="tf-date" value="${f.date}" style="min-width:0"><input class="t" type="time" id="tf-time" value="${f.time}" style="min-width:0"></div>
    <div class="mini" style="margin-top:8px"><select class="t" id="tf-person"><option value="">Wer? (offen)</option>${S.people.map(p=>`<option ${sel(p,f.person)}>${esc(p)}</option>`).join('')}</select>
    <select class="t" id="tf-stand"><option value="">Stand (optional)</option>${S.stands.map(x=>`<option value="${x.id}" ${sel(x.id,f.stand)}>${esc(x.name)}</option>`).join('')}</select></div>
    <div class="mini" style="margin-top:8px"><select class="t" id="tf-type"><option value="todo" ${sel('todo',f.type)}>Aufgabe</option><option value="termin" ${sel('termin',f.type)}>Termin</option></select></div>
    <div class="mini" style="margin-top:8px"><button class="btn" data-pl="tsave" style="margin:0">${f.id?'Speichern':'Hinzufügen'}</button>${(f.id||cur.tfOpen)?'<button class="btn sec" data-pl="tcancel" style="margin:0">Abbrechen</button>':''}</div>
    ${f.id?'<button class="btn red" data-pl="tdel">Löschen</button>':''}</div>`;
}
function vPlan(){
  const seg=`<div class="chips">${[['kal','Kalender'],['aufg','Aufgaben'],['notiz','Notizen']].map(([k,l])=>`<button class="chip ${cur.ptab===k?'on':''}" data-pl="ptab" data-v="${k}">${l}</button>`).join('')}</div>`;
  $('#app').innerHTML=backupWarn()+seg+({kal:planKal,aufg:planAufg,notiz:planNotiz})[cur.ptab]();
}
function planKal(){
  const [y,m]=cur.cal.split('-').map(Number),td=todayStr(),sb=salesByDate();
  const off=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate();
  let cells='<i></i>'.repeat(off);
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${p2(m)}-${p2(d)}`,ts=S.tasks.filter(t=>t.date===ds),open=ts.filter(t=>!t.done).length;
    const dots=(open?`<em class="d ${ds<td?'r':'b'}"></em>`:ts.length?'<em class="d x"></em>':'')+(sb[ds]?'<em class="d g"></em>':'');
    cells+=`<button class="cd ${ds===cur.cday?'sel':''} ${ds===td?'today':''}" data-pl="cday" data-v="${ds}"><b>${d}</b><span>${dots}</span></button>`;
  }
  const day=S.tasks.filter(t=>t.date===cur.cday).sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1);
  const s=sb[cur.cday];
  return `<div class="card pad"><div class="calhead"><button data-pl="cmon" data-v="-1">‹</button><b>${new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button data-pl="cmon" data-v="1">›</button></div>
    <div class="cal"><u>Mo</u><u>Di</u><u>Mi</u><u>Do</u><u>Fr</u><u>Sa</u><u>So</u>${cells}</div>
    <div class="hint"><em class="d b"></em> offen &nbsp;<em class="d r"></em> überfällig &nbsp;<em class="d g"></em> Verkauf erfasst</div>
    <button class="btn sec" data-pl="ctoday" style="margin:0">Heute</button></div>
    <h2 style="margin-top:4px">${wdD(cur.cday)}</h2>
    ${s?`<div class="card pad"><div class="kv"><span>Verkauf (alle Stände)</span><span>${s.q} Stk. · ${eur0(s.r)}</span></div></div>`:''}
    <div class="card">${day.map(t=>taskRow(t,false)).join('')||'<div class="row"><span class="p">Nichts eingetragen.</span></div>'}</div>
    ${taskForm()}`;
}
function planAufg(){
  const td=todayStr(),pfl=cur.pf;
  const list=S.tasks.filter(t=>!pfl||t.person===pfl),open=list.filter(t=>!t.done);
  const srt=a=>a.slice().sort((x,y)=>((x.date||'9')+(x.time||''))<((y.date||'9')+(y.time||''))?-1:1);
  const groups=[['Überfällig',open.filter(t=>t.date&&t.date<td)],['Heute',open.filter(t=>t.date===td)],['Demnächst',open.filter(t=>t.date>td)],['Ohne Datum',open.filter(t=>!t.date)]];
  const done=list.filter(t=>t.done);
  return `<div class="chips"><button class="chip ${!pfl?'on':''}" data-pl="pf" data-v="">Alle</button>${S.people.map(p=>`<button class="chip ${pfl===p?'on':''}" data-pl="pf" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>
    <button class="btn" data-pl="tnew" style="margin-top:0">+ Neuer Eintrag</button>
    ${cur.tfOpen?taskForm():''}
    ${groups.map(([n,a])=>a.length?`<h3>${n} (${a.length})</h3><div class="card">${srt(a).map(t=>taskRow(t,true)).join('')}</div>`:'').join('')}
    ${done.length?`<h3>Erledigt (${done.length})</h3><div class="card">${srt(done).reverse().slice(0,15).map(t=>taskRow(t,true)).join('')}</div>`:''}
    ${!S.tasks.length?'<div class="hint">Noch keine Einträge.</div>':''}`;
}
function planNotiz(){
  const ns=S.notes.slice().sort((a,b)=>b.created-a.created);
  return `<div class="card pad"><label class="f">Schnelle Notiz (fällt dir was auf? Hier rein, später einordnen)</label>
    <textarea class="t" id="nt-text" placeholder="z. B. Kabeltrommel für Quick fehlt">${esc(cur.ntext)}</textarea>
    <button class="btn" data-pl="nsave" style="margin-bottom:0">Notiz speichern</button></div>
    ${cur.tfOpen&&cur.tf.noteId?taskForm():''}
    <div class="hint">Abends: Backup sichern, Datei in den Eingang-Ordner legen und mir „Notizen zuordnen“ sagen. Du bekommst Vorschläge, die du hier mit einem Tipp übernimmst.</div>
    ${ns.map(n=>{const sg=n.suggest;return `<div class="card pad ${n.status==='zugeordnet'?'dim':''}"><div>${esc(n.text)}</div>
      <div style="color:var(--mut);font-size:12px;margin-top:4px">${new Date(n.created).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${n.status==='zugeordnet'?' · zugeordnet':''}</div>
      ${sg?`<div class="sug"><b>Vorschlag:</b> ${esc(sg.title||n.text)}<br><small>${esc([sg.date&&wdD(sg.date),sg.time,sg.person,standNm(sg.stand)||sg.stand].filter(Boolean).join(' · '))}</small>
        <div class="mini" style="margin-top:6px"><button class="btn green" data-pl="sugok" data-v="${n.id}" style="margin:0">Übernehmen</button><button class="btn sec" data-pl="sugno" data-v="${n.id}" style="margin:0">Verwerfen</button></div></div>`:''}
      <div class="mini" style="margin-top:8px">${n.status!=='zugeordnet'?`<button class="btn sec" data-pl="n2t" data-v="${n.id}" style="margin:0">→ Aufgabe</button>`:''}<button class="btn sec" data-pl="ndel" data-v="${n.id}" style="margin:0;color:var(--red)">Löschen</button></div></div>`}).join('')||'<div class="hint">Noch keine Notizen.</div>'}`;
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-pl]');if(!t)return;
  const a=t.dataset.pl,v=t.dataset.v,reset=()=>{cur.tf=newTf(cur.cday);cur.tfOpen=false};
  if(a==='ptab'){cur.ptab=v;return render()}
  if(a==='goto'){tab='plan';cur.ptab=v;window.scrollTo(0,0);return render()}
  if(a==='cday'){cur.cday=v;if(!cur.tf.id)cur.tf.date=v;return render()}
  if(a==='cmon'){const [y,m]=cur.cal.split('-').map(Number),d=new Date(y,m-1+(+v),1);cur.cal=d.getFullYear()+'-'+p2(d.getMonth()+1);return render()}
  if(a==='ctoday'){cur.cday=todayStr();cur.cal=cur.cday.slice(0,7);if(!cur.tf.id)cur.tf.date=cur.cday;return render()}
  if(a==='pf'){cur.pf=v;return render()}
  if(a==='tdone'){const x=S.tasks.find(x=>x.id===v);x.done=!x.done;save();return render()}
  if(a==='tedit'){const x=S.tasks.find(x=>x.id===v);cur.tf={id:x.id,title:x.title,date:x.date||'',time:x.time||'',person:x.person||'',stand:x.stand||'',type:x.type||'todo',noteId:null};cur.tfOpen=true;return render()}
  if(a==='tnew'){cur.tf=newTf('');cur.tfOpen=true;return render()}
  if(a==='tcancel'){reset();return render()}
  if(a==='tdel'){if(confirm('Eintrag löschen?')){S.tasks=S.tasks.filter(x=>x.id!==cur.tf.id);reset();save();render()}return}
  if(a==='tsave'){
    const f=cur.tf;if(!f.title.trim())return alert('Bitte einen Titel eingeben.');
    const base={title:f.title.trim(),date:f.date,time:f.time,person:f.person,stand:f.stand,type:f.type};
    if(f.id)Object.assign(S.tasks.find(x=>x.id===f.id),base);
    else{const task={id:uid(),...base,done:false,created:Date.now()};S.tasks.push(task);
      if(f.noteId){const n=S.notes.find(n=>n.id===f.noteId);if(n){n.status='zugeordnet';n.taskId=task.id;delete n.suggest}}}
    reset();save();return render();
  }
  if(a==='nsave'){const x=($('#nt-text').value||'').trim();if(!x)return;S.notes.push({id:uid(),text:x,created:Date.now(),status:'neu'});cur.ntext='';save();return render()}
  if(a==='n2t'){const n=S.notes.find(n=>n.id===v);cur.tf={...newTf(cur.cday),title:n.text.slice(0,200),noteId:n.id};cur.tfOpen=true;cur.ptab='notiz';window.scrollTo(0,0);return render()}
  if(a==='ndel'){if(confirm('Notiz löschen?')){S.notes=S.notes.filter(n=>n.id!==v);save();render()}return}
  if(a==='sugno'){delete S.notes.find(n=>n.id===v).suggest;save();return render()}
  if(a==='sugok'){
    const n=S.notes.find(n=>n.id===v),sg=n.suggest;
    const st=S.stands.find(x=>x.id===sg.stand||x.name.toLowerCase()===String(sg.stand||'').toLowerCase());
    const task={id:uid(),title:sg.title||n.text,date:sg.date||'',time:sg.time||'',person:sg.person||'',stand:st?st.id:'',type:sg.type==='termin'?'termin':'todo',done:false,created:Date.now()};
    S.tasks.push(task);n.status='zugeordnet';n.taskId=task.id;delete n.suggest;save();return render();
  }
});
document.addEventListener('input',ev=>{

  if(t.id&&t.id.startsWith('tf-'))cur.tf[t.id.slice(3)]=t.value;

/* ---------- Dashboard pro Stand ---------- */
function kvList(a){
  const s=a;
  const row=(l,v,c,hl)=>`<div class="kv ${hl?'hl':''}"><span>${l}</span><span class="${c||''}">${v}</span></div>`;
  return `<div class="card">
    ${row('Soll-Bestand',num(s.soll)+' Stk.',s.soll<0?'neg':'',1)}
    ${row('Verkäufe',num(s.verk)+' Stk.')}
    ${row('Umsatz',eur0(s.umsatz))}
    ${row('Gewinn',eur0(s.gewinn),s.gewinn<0?'neg':'pos',1)}
    ${row('Retouren',num(s.ret)+' Stk.')}
    ${row('Lieferung',num(s.lief)+' Stk.')}
    ${row('Produktionskosten',eur0(s.pcost))}
    ${row('Standgebühren',eur0(s.fee))}
    ${row('Personalkosten',eur0(s.staff))}
    ${row('Auf-/Abbaukosten',eur0(s.setup))}
    ${row('Lieferkosten',eur0(s.freight))}
    ${row('Ist-Bestand',s.ist==null?'–':num(s.ist)+' Stk.')}
    ${row('Differenz (Ist − Soll)',s.diff==null?'–':num(s.diff)+' Stk.',s.diff==null?'':s.diff<0?'neg':'')}
  </div>`;
}
function insights(a){
  const out=[];
  if(a.avg)out.push(['Ø Verkäufe pro Verkaufstag',a.avg.toLocaleString('de-DE',{maximumFractionDigits:1})+' Stk.']);
  if(a.verk)out.push(['Ø Preis pro Baum',eur(a.umsatz/a.verk)]);
  if(a.verk)out.push(['Ø Gewinn pro Baum (nach allen Kosten)',eur(a.gewinn/a.verk)]);
  if(a.best)out.push(['Bester Tag',shortD(a.best)+' · '+eur0(a.byDay[a.best].r)]);
  if(a.avg3&&a.soll>0)out.push(['Bestand reicht noch ca.',(a.soll/a.avg3).toLocaleString('de-DE',{maximumFractionDigits:1})+' Tage (Ø letzte 3 Tage)']);
  if(a.fixed>0&&a.verk>0&&a.umsatz>a.pcost){const mg=(a.umsatz-a.pcost)/a.verk,m=(a.fixed-(a.umsatz-a.pcost))/mg;out.push(['Gewinnschwelle',m<=0?'erreicht':'noch ca. '+Math.ceil(m)+' Bäume'])}
  return out.length?`<div class="card">${out.map(([l,v])=>`<div class="kv"><span>${l}</span><span>${v}</span></div>`).join('')}</div>`:'';
}
function prodChart(a){
  const rows=Object.entries(a.byProd).map(([id,q])=>({l:pname(id),v:q})).sort((x,y)=>y.v-x.v).slice(0,12);
  return hbars(rows,v=>v+' Stk.');
}

/* ---------- Daten / Einstellungen ---------- */
function vDaten(){
  $('#app').innerHTML=`${backupWarn()}
  <h2 style="margin-top:4px">Backup</h2>
  <div class="card pad"><div class="hint">Täglich abends sichern (iCloud Drive, Mail oder AirDrop).</div>
  <button class="btn" id="bJson">Backup sichern (JSON)</button>
  <button class="btn sec" id="bCsv">Excel-Export (CSV)</button>
  <button class="btn sec" id="bImp">Backup einspielen …</button>
  <input type="file" id="fImp" accept=".json,application/json" hidden></div>
  <h2>Stände & Kosten</h2>
  ${S.stands.map(s=>`<div class="card pad"><div class="edit"><input class="t" data-sn="${s.id}" value="${esc(s.name)}"><button class="x" data-del-s="${s.id}">×</button></div>
    <div class="mini">
    <div><label class="f">Standgebühr €</label><input class="t" inputmode="decimal" data-sc="fee" data-sid="${s.id}" value="${String(s.fee||0).replace('.',',')}"></div>
    <div><label class="f">Personal €</label><input class="t" inputmode="decimal" data-sc="staff" data-sid="${s.id}" value="${String(s.staff||0).replace('.',',')}"></div></div>
    <div class="mini">
    <div><label class="f">Auf-/Abbau €</label><input class="t" inputmode="decimal" data-sc="setup" data-sid="${s.id}" value="${String(s.setup||0).replace('.',',')}"></div>
    <div><label class="f">Lieferkosten €</label><input class="t" inputmode="decimal" data-sc="freight" data-sid="${s.id}" value="${String(s.freight||0).replace('.',',')}"></div></div></div>`).join('')}
  <button class="btn sec" id="addS">+ Stand</button>
  <h2>Produkte & Preise</h2>
  <div class="card pad"><div class="hint">Name · Verkaufspreis · Produktionskosten pro Stück. Neuer Preis gilt für neu angelegte Tage, alte Tage behalten ihren.</div>
  ${S.products.map(p=>`<div class="edit"><input class="t" data-pn="${p.id}" value="${esc(p.name)}">
    <input class="t" style="width:64px" inputmode="decimal" data-pp="${p.id}" value="${String(p.price).replace('.',',')}">
    <input class="t" style="width:58px" inputmode="decimal" data-pc="${p.id}" value="${String(p.cost||0).replace('.',',')}">
    <button class="x" data-del-p="${p.id}">×</button></div>`).join('')}
  <button class="btn sec" id="addP">+ Produkt</button></div>
  <h2>Team</h2>
  <div class="card pad"><div class="hint">Namen für „Wer?“ bei Aufgaben.</div>
  ${S.people.map((p,i)=>`<div class="edit"><input class="t" data-pe="${i}" value="${esc(p)}"><button class="x" data-del-pe="${i}">×</button></div>`).join('')}
  <button class="btn sec" id="addPe">+ Person</button></div>
  <h2>Vorschläge einspielen</h2>
  <div class="card pad"><div class="hint">Datei mit Zuordnungsvorschlägen zu deinen Notizen (von Claude).</div>
  <button class="btn sec" id="bSug">Vorschläge-Datei wählen …</button>
  <input type="file" id="fSug" accept=".json,application/json" hidden></div>
  <h2>Gefahrenzone</h2>
  <div class="card pad"><button class="btn red" id="reset">Alle Daten löschen</button></div>

function download(name,type,content){
  const blob=new Blob([content],{type});
  const file=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>1);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}
function csv(){
  const L=['Datum;Stand;Typ;Produkt;Anzahl;Preis;Umsatz;Ist-Bestand;Notiz'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""').replace(/\n/g,' ')+'"';
  const nf=n=>String(n).replace('.',',');
  const sn=sid=>{const s=S.stands.find(x=>x.id===sid);return q(s?s.name:sid)};
  Object.keys(S.entries).sort().forEach(k=>{
    const [sid,d]=k.split('|'),e=entry(sid,d);let first=true;
    const tail=()=>{const r=first?[e.rest,q(e.note)]:['',''];first=false;return r};
    S.products.filter(p=>+e.counts[p.id]>0).forEach(p=>L.push([d,sn(sid),'Verkauf',q(p.name),e.counts[p.id],nf(price(e,p)),nf(e.counts[p.id]*price(e,p)),...tail()].join(';')));
    e.extra.forEach(x=>L.push([d,sn(sid),'Verkauf (Einzelpreis)',q(pname(x.pid)),exq(x),nf(x.price),nf(x.price*exq(x)),...tail()].join(';')));
    if(first&&(e.rest!==''||e.note))L.push([d,sn(sid),'Tagesnotiz','',0,'',0,e.rest,q(e.note)].join(';'));
  });
  S.moves.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(m=>L.push([m.date,sn(m.stand),m.type==='L'?'Lieferung':'Retoure','',m.qty,'','','',''].join(';')));
  return '﻿'+L.join('\r\n');
}
document.addEventListener('click',ev=>{
  const t=ev.target,id=t.id,stamp=todayStr();
  if(id==='bJson'||id==='bCsv'){S.lastExport=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    id==='bJson'?download(`${stamp}_Droste-Backup.json`,'application/json',JSON.stringify(S)):download(`${stamp}_Droste-Verkauf.csv`,'text/csv;charset=utf-8',csv());render()}
  if(id==='bImp')$('#fImp').click();
  if(id==='addP'){S.products.push({id:'p'+uid(),name:'Neu',price:0,cost:0});save();render()}
  if(id==='addS'){S.stands.push(mkStand('s'+uid(),'Neuer Stand'));save();render()}
  if(t.dataset.delP){
    const p=prod(t.dataset.delP);
    if(confirm(`„${p.name}" entfernen? Bereits erfasste Zahlen dazu gehen in den Auswertungen verloren.`)){S.products=S.products.filter(x=>x!==p);save();render()}
  }
  if(t.dataset.delS){
    const s=S.stands.find(x=>x.id===t.dataset.delS);
    if(S.stands.length>1&&confirm(`Stand „${s.name}" samt allen Daten entfernen?`)){
      S.stands=S.stands.filter(x=>x!==s);S.moves=S.moves.filter(m=>m.stand!==s.id);
      Object.keys(S.entries).forEach(k=>{if(k.startsWith(s.id+'|'))delete S.entries[k]});
      if(cur.stand===s.id)cur.stand=S.stands[0].id;save();render()}
  }
  if(id==='reset'&&confirm('Wirklich ALLE Daten löschen? Vorher Backup sichern!')&&confirm('Sicher? Das kann nicht rückgängig gemacht werden.')){
    S=DEFAULT();cur.stand=S.stands[0].id;save();render()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='fImp'&&t.files[0]){
    const r=new FileReader();r.onload=()=>{try{
      const d=JSON.parse(r.result);if(!d.stands||!d.products||!d.entries||d.v!==2)throw 0;
      if(confirm('Aktuelle Daten durch dieses Backup ersetzen?')){S=d;if(!S.moves)S.moves=[];S.tasks=S.tasks||[];S.notes=S.notes||[];S.people=(S.people&&S.people.length)?S.people:['Till'];save();cur.stand=S.stands[0].id;render()}
    }catch(e){alert('Keine gültige Backup-Datei.')}};r.readAsText(t.files[0]);
  }
  if(t.dataset.pn){prod(t.dataset.pn).name=t.value||'?';save()}
  if(t.dataset.pp){prod(t.dataset.pp).price=pf(t.value);save()}
  if(t.dataset.pc){prod(t.dataset.pc).cost=pf(t.value);save()}
  if(t.dataset.sn){S.stands.find(s=>s.id===t.dataset.sn).name=t.value||'?';save()}
  if(t.dataset.sc){S.stands.find(s=>s.id===t.dataset.sid)[t.dataset.sc]=pf(t.value);save()}
});

document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.id==='addPe'){S.people.push('Neu');save();render()}
  if(t.id==='bSug')$('#fSug').click();
  if(t.dataset.delPe!=null&&S.people.length>1){S.people.splice(+t.dataset.delPe,1);save();render()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.pe!=null){S.people[+t.dataset.pe]=t.value.trim()||'?';save()}
  if(t.id==='fSug'&&t.files[0]){
    const r=new FileReader();r.onload=()=>{try{
      const d=JSON.parse(r.result),items=d.suggestions||d;let n=0;
      items.forEach(it=>{const note=S.notes.find(x=>x.id===it.noteId);if(note&&note.status!=='zugeordnet'){note.suggest={title:it.title,date:it.date,time:it.time,person:it.person,stand:it.stand,type:it.type};n++}});
      save();alert(n+' Vorschläge eingespielt. Sie stehen unter Plan, Notizen.');
    }catch(e){alert('Keine gültige Vorschläge-Datei.')}};r.readAsText(t.files[0]);
  }
});

render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

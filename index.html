<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Droste">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2c463d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Droste Verkauf</title>
<style>
:root{
  color-scheme:dark;
  --bg:#2c463d; --fill:rgba(0,0,0,.26); --card:#22372f; --text:#f5f7f6; --mut:#b4c8c3; --line:rgba(255,255,255,.18);
  --green:#2e9e4f; --red:#f0503c; --blue:#0071e3; --link:#7cc0ff; --panel:rgba(124,192,255,.16); --orange:#ffae42;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#2c463d 0%,#223a32 40%,#162620 75%,#0f1b16 100%)}
html{min-height:100%;background-color:#0f1b16;background-image:linear-gradient(180deg,#2c463d 0%,#223a32 40%,#162620 75%,#0f1b16 100%);background-repeat:no-repeat;background-size:100% 100vh}
body{background:transparent;color:var(--text);font:16px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{flex-wrap:wrap;background:#2c463d;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header img{height:38px;display:block;border-radius:4px;background:#fff}
#hofbar{order:3;flex-basis:100%;margin-top:6px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.25);color:var(--text);text-decoration:none;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid rgba(255,255,255,.35)}
.fn{min-width:32px;text-align:center;font-size:18px}
.ctr button.fb{width:44px;font-size:15px;font-weight:700;padding:0}
.ctr button.fb[data-pl=fall]{width:64px}
header img{flex:none}
#prof{flex:1 1 0;min-width:0;justify-content:flex-end}
#prof>span:last-child{min-width:0}
#prof b,#prof small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
body.authed #lang{display:none}
.fmap{position:relative;border-radius:14px;overflow:hidden;margin:6px 0}.fmap img{display:block;width:100%;height:auto}
.pin{position:absolute;width:46px;height:46px;margin:-34px 0 0 -23px;border-radius:50%;border:2px solid transparent;background:transparent;padding:0}.pin.on{border-color:#ffd60a}
.zoomv{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92)}.zoomv .zs{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}.zoomv img{width:220%;max-width:none;display:block}
.zx{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:61;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:26px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.rtile{border:2px solid var(--line);background:var(--fill);color:var(--text);border-radius:14px;padding:20px 6px;font:inherit;font-size:17px;font-weight:700}.rtile.on{border-color:var(--blue);background:var(--panel)}
.bdg{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;margin-right:6px}
.urg{border:1px solid var(--red)}.chkrow{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:16px}.chkrow input{width:22px;height:22px}
.rimg{width:100%;border-radius:10px;margin-top:8px;display:block}
.row.pk{padding:5px 0}.row.pk .n{font-size:15px}.row.pk .chk{width:26px;height:26px;font-size:14px}
.note{border:1px solid var(--orange)!important;background:rgba(255,174,66,.08)!important}.bul{margin:4px 0 0;padding-left:18px}.bul li{font-size:14px;margin:3px 0}
body.run header,body.run #nav{display:none}
.trun{padding-top:calc(14px + env(safe-area-inset-top))}
.timer{font-size:54px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:6px 0}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;margin-top:14px}.htile{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--text);font:inherit;font-size:13px;font-weight:600}.hic{position:relative;width:72px;height:72px;border-radius:18px;background:var(--fill);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:36px}.hbd{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-style:normal;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.vrow{display:flex;gap:8px;align-items:center;margin:8px 0}.vrow label,.vrow .vl{width:64px;text-align:right;color:var(--mut);flex:none}.vrow input{flex:1;min-width:0;text-align:right;font-size:20px}.vrow input.small{flex:none;width:70px}.vrow span{flex:none}
.rm{width:100%;border-collapse:collapse;font-size:13px}.rm th{padding:4px 2px;color:var(--mut);font-size:12px}.rm td{padding:5px 2px;border-top:1px solid var(--line);text-align:center}.rm td:first-child{text-align:left;padding-right:6px}.rm td.rg{background:var(--fill);font-weight:700;color:var(--link);text-align:left;font-size:12px}.rm input{width:20px;height:20px}
.pkl{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:14px}.pkrow{margin-top:6px;display:flex;flex-wrap:wrap}
.tour.compact{background:none;padding:0}.tour.compact>div:first-child,.tour.compact>.barw{display:none!important}
.btn.add{background:transparent;border:2px dashed var(--blue);color:var(--link)}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.green{background:transparent;border:2px solid var(--green);color:#7fe0a0}
.btn.green.go,.cheers .btn.green{background:var(--green);border:0;color:#fff}
.formc{border:1px solid rgba(0,113,227,.6)!important;background:rgba(0,113,227,.08)!important}
.qtile{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--fill);color:var(--text);border-radius:16px;padding:16px 8px;font:inherit;font-size:15px;font-weight:700}
.qtile b{font-size:26px;line-height:1}
.steps{display:flex;align-items:center;gap:6px;margin:8px 0 2px;font-size:12px}.steps .s{color:var(--mut);font-weight:600}.steps .s.on{color:var(--link)}.steps .s.cur{color:var(--orange)}.steps .s.fin{color:#7fe0a0}.steps i{flex:1;height:2px;background:var(--line);min-width:10px}
.tdot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px;margin:4px 0 10px}
.seg button{flex:1;min-width:0;border:0;background:none;color:var(--mut);font:inherit;font-size:14px;font-weight:600;padding:9px 4px;border-radius:9px;white-space:nowrap}
.seg button.on{background:var(--blue);color:#fff}
#asrole{flex:none;max-width:104px;height:34px;margin-right:8px;border:0;border-radius:12px;background:rgba(0,0,0,.25);color:var(--text);font:inherit;font-size:16px;font-weight:700;padding:0 8px}
#help{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.25);color:var(--text);font-size:18px;font-weight:700;line-height:1;padding:0;margin-right:6px}
#refresh{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.25);color:var(--text);font-size:20px;line-height:1;padding:0;margin-right:8px}
#refresh.spin{animation:rspin .8s linear infinite}@keyframes rspin{to{transform:rotate(360deg)}}
#lang{flex:none;display:flex;gap:2px;background:rgba(0,0,0,.25);border-radius:999px;padding:2px;margin-left:auto;margin-right:10px}
#lang button{border:0;background:none;color:var(--mut);font-size:12px;font-weight:700;padding:6px 9px;border-radius:999px}
#lang button.on{background:var(--blue);color:#fff}
#prof{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--text);padding:2px;text-align:left;font:inherit}
#prof b{display:block;font-size:14px;line-height:1.1}
#prof small{display:block;font-size:11px;color:var(--mut);line-height:1.2}
#av:empty{display:none}
#av{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal u{text-decoration:none;text-align:center;font-size:11px;color:var(--mut);padding-bottom:2px}
.cd{height:46px;border:1px solid transparent;border-radius:10px;background:var(--fill);color:var(--text);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit}
.cd b{font-size:14px;font-weight:600}.cd span{height:7px;display:flex;gap:3px}
.cd.sel{background:var(--blue);color:#fff}.cd.today{border-color:#ffd60a;background:rgba(255,214,10,.26)}
em.d{display:inline-block;width:6px;height:6px;border-radius:50%;font-style:normal}
.d.b{background:var(--link)}.d.r{background:var(--red)}.d.g{background:var(--green)}.d.x{background:var(--line)}
.cd.sel .d.b{background:#fff}
.mcal{display:grid;grid-template-columns:20px repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin:0 -4px 10px;background:var(--fill);border-radius:6px;overflow:hidden}
.mcal>*{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mcal u{text-decoration:none;text-align:center;font-size:11px;color:var(--mut);padding:4px 0}
.mcal .kw{display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--mut)}
.mcal .kw span{writing-mode:vertical-rl;transform:rotate(180deg)}
.md{min-height:84px;padding:2px 1px;display:flex;flex-direction:column;gap:2px;align-items:stretch;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;color:var(--text);font:inherit;text-align:left;min-width:0}
.md>b{font-size:11px;text-align:right;padding-right:3px;font-weight:600}
.md.out{opacity:.4}.md.today{background:rgba(255,214,10,.26)}.md.today>b{color:#ffd60a}.md.sel{background:var(--panel);box-shadow:inset 0 0 0 2px var(--blue)}.md.today.sel{background:rgba(255,214,10,.26)}
.md i{display:block;font-style:normal;font-size:9px;line-height:1.25;padding:1px 2px;border:1px solid var(--link);border-radius:3px;overflow:hidden;white-space:nowrap;text-overflow:clip;color:var(--text)}
.md i.c-x{border-color:#8e99a0}.md i.c-g{border-color:var(--green)}.md i.c-o{border-color:var(--orange)}.md i.c-t{border-color:#3fc7b0}.md i.c-v{border-color:#c06be8}
.md em.more{font-style:normal;font-size:9px;color:var(--mut);padding-left:2px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;color:#fff;font-size:15px;padding:0}
.chk.on{background:var(--green);border-color:var(--green)}
.done{text-decoration:line-through;color:var(--mut)}
.dim{opacity:.6}
.sug{background:var(--panel);border-radius:12px;padding:10px;margin-top:8px;font-size:14px}.sug small{color:var(--mut)}
.tbanner{background:var(--panel);color:var(--link);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.big{display:flex;align-items:baseline;gap:8px;margin:2px 0 14px}
.big b{font-size:46px;letter-spacing:-.03em;line-height:1}.big em{font-style:normal;color:var(--mut)}
.big span{margin-left:auto;font-size:24px;color:var(--link);font-weight:600}
details{border-top:1px solid var(--line)}
summary{list-style:none;padding:14px 0;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:'›';color:var(--mut);font-size:20px;line-height:1;transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
.claim{flex:none;border:1px solid var(--blue);color:var(--link);background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.who{color:var(--link);font-weight:600}
.cheers{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.cheers>div{background:var(--card);color:var(--text);border-radius:20px;padding:28px 22px;text-align:center;max-width:320px}
.cheers b{display:block;font-size:52px;font-weight:400}.cheers p{font-size:18px;font-weight:600;margin:8px 0 16px}
.wxrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wxd{background:var(--fill);border-radius:14px;padding:10px 4px;text-align:center}
.wxd small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.wxd .ic{font-size:30px;line-height:1.25}.wxd b{font-size:15px}
.pk{display:flex;gap:10px;align-items:center;padding:8px 6px;font-size:15px}
.pk input{width:22px;height:22px;accent-color:var(--green)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.dy{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;border-radius:12px;background:var(--fill);color:var(--text);padding:6px 0;font:inherit}
.dy small{color:var(--mut);font-size:11px}.dy b{font-size:16px}.dy span{height:7px;display:flex;gap:2px}
.dy.sel{background:var(--blue)}.dy.sel small{color:#fff}.dy.today{border-color:#ffd60a;background:rgba(255,214,10,.26)}.dy.today.sel{background:var(--blue)}
.tour{background:var(--fill);border-radius:16px;padding:12px;margin-bottom:14px}.tour .card{margin:6px 0}
a{color:var(--link)}
.chk.big{width:38px;height:38px;font-size:22px}
.barw{height:10px;background:var(--fill);border-radius:6px;overflow:hidden}
.barw i{display:block;height:100%;background:var(--green);border-radius:6px}
.tile small+b+small{margin-top:2px}
.wheels{display:flex;gap:8px;margin-bottom:8px}
.wcol{flex:1;position:relative}
.wheel{height:150px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:55px 0;background:var(--fill);border-radius:12px;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font-size:22px;font-weight:600;color:var(--mut);cursor:pointer}
.band{position:absolute;left:4px;right:4px;top:55px;height:40px;border-radius:10px;background:rgba(0,113,227,.14);border:1px solid rgba(0,113,227,.4);pointer-events:none}
main{max-width:600px;margin:0 auto;padding:12px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px}
.datebar input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);
  font-size:16px;text-align:center;padding:0 8px}
.card{background:transparent;border-radius:0;padding:0;margin-bottom:10px;overflow:hidden}
.card.pad{padding:6px 0}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:0}
.row .n{font-weight:600}.row .p{color:var(--mut);font-size:15px}.card .p{font-size:15px}.infoi{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--link);background:none;color:var(--link);font-size:14px;font-weight:700;font-style:italic;padding:0;margin-left:8px}.dots{flex:none;width:44px;height:44px;border:0;background:none;color:var(--text);font-size:26px;line-height:1;padding:0;margin:-6px -6px 0 0}.thead{cursor:pointer}.thead .chev{float:right;font-size:20px;color:var(--mut)}.pbadge{font-weight:700}.ihead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 6px}.ihead b{font-size:19px}.infobox{background:var(--fill);border-radius:12px;padding:10px 12px;margin:0 0 10px;color:var(--text)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid rgba(0,0,0,.2)}
.ctr{display:flex;align-items:center;gap:4px}
.ctr button{width:42px;height:42px;border-radius:12px;border:0;font-size:24px;background:var(--fill);color:var(--text)}
.ctr button.plus{background:var(--green);color:#fff}
.ctr input{width:46px;height:42px;text-align:center;font-size:19px;font-weight:600;border:0;background:transparent;color:var(--text)}
.sum{display:flex;justify-content:space-between;padding:14px 0;font-weight:700;font-size:18px}
.sum span:last-child{color:var(--link)}
label.f{display:block;color:var(--mut);font-size:13px;margin:12px 0 4px}
label.f:first-child{margin-top:0}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
a,button,input,select,textarea,label,summary,.row,.chip,.cd,.md,.dy,[data-pl],[data-t]{touch-action:manipulation}
button,.chip,.htile,.qtile,.rtile,.chk,.fb,.seg button,#nav button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.zoomv,.zoomv *{touch-action:pan-x pan-y pinch-zoom}
input.t,textarea.t,select.t{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:16px;background:var(--fill);color:var(--text);font-family:inherit}
textarea.t{min-height:76px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:600;background:var(--blue);color:#fff;margin:8px 0}
.btn.sec{background:var(--card);color:var(--link);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn.green{background:var(--green)}
.hint{color:var(--mut);font-size:15px;margin:6px 2px 8px}
.warn{background:rgba(255,174,66,.18);color:#ffd08a;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--panel);color:var(--link);text-align:left;padding:8px 6px;font-size:12px}
td{padding:8px 6px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--text)}
h2{font-size:20px;margin:18px 0 8px;letter-spacing:-.01em}
h3{font-size:15px;margin:14px 0 4px;color:var(--mut);font-weight:600}
.mini{display:flex;gap:8px}.mini>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:#101d18;border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:10px 2px 8px;font-size:11px;color:var(--mut)}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--link)}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#1d1d1f;color:#fff;
  padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.saved.show{opacity:.92}
.edit{display:flex;gap:8px;margin-bottom:8px;align-items:center}.edit input{min-width:0}
.edit .x{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--fill);color:var(--red);font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:var(--fill);border-radius:16px;padding:12px 14px}
.tile small{display:block;color:var(--mut);font-size:12px}
.tile b{font-size:22px;letter-spacing:-.02em}

function stats(sids){
  sids=[].concat(sids);
  const R={verk:0,umsatz:0,pcost:0,lief:0,ret:0,fee:0,staff:0,setup:0,freight:0,byDay:{},byProd:{},byWd:[0,0,0,0,0,0,0],ist:null,istDate:'',dayMoves:{}};
  const dset=new Set();
  sids.forEach(sid=>{
    const st=S.stands.find(s=>s.id===sid)||{};const pName=String(sid).startsWith('p:')?String(sid).slice(2):'';
    ['fee','staff','setup','freight'].forEach(k=>R[k]+=(+st[k]||0));
    let latest='';
    Object.keys(S.entries).forEach(k=>{
      const [s,d]=k.split('|');if(s!==sid)return;
      const e=entry(s,d),q=qtyOf(e),r=revOf(e);
      R.verk+=q;R.umsatz+=r;R.pcost+=costOf(e);
      const o=R.byDay[d]||(R.byDay[d]={q:0,r:0});o.q+=q;o.r+=r;dset.add(d);
      R.byWd[new Date(d+'T12:00:00').getDay()]+=r;
      prodQty(e,R.byProd);
      if(e.rest!==''&&e.rest!=null&&d>=latest){latest=d;R.istSid=R.istSid||{};R.istSid[sid]={d,v:parseInt(e.rest)||0}}
    });
    S.moves.forEach(m=>{if(m.stand!==sid)return;
      const o=R.dayMoves[m.date]||(R.dayMoves[m.date]={l:0,r:0});
      if(m.type==='L'){R.lief+=m.qty;o.l+=m.qty}else{R.ret+=m.qty;o.r+=m.qty}dset.add(m.date)});
    if(st.id||pName)delivEntries(pName?{n:pName}:{id:sid,n:st.name}).forEach(d=>{const o=R.dayMoves[d.date]||(R.dayMoves[d.date]={l:0,r:0});R.lief+=d.n;o.l+=d.n;dset.add(d.date);R.autoLief=(R.autoLief||0)+d.n});
  });
  if(R.istSid){const v=Object.values(R.istSid);R.ist=v.reduce((a,x)=>a+x.v,0);R.istAll=v.length===sids.length}
  R.fixed=R.fee+R.staff+R.setup+R.freight;
  R.gewinn=R.umsatz-R.pcost-R.fixed;
  R.soll=R.lief-R.ret-R.verk;
  R.diff=R.ist==null?null:R.ist-R.soll;
  R.dates=[...dset].sort();
  let cum=0;
  R.bestand=R.dates.map(d=>{const q=(R.byDay[d]||{q:0}).q,m=R.dayMoves[d]||{l:0,r:0};cum+=m.l-m.r-q;return {l:shortD(d),v:cum}});
  R.days=R.dates.filter(d=>R.byDay[d]).length;
  const sd=R.dates.filter(d=>R.byDay[d]&&R.byDay[d].q>0);
  R.avg=sd.length?R.verk/sd.length:0;
  const last3=sd.slice(-3);R.avg3=last3.length?last3.reduce((a,d)=>a+R.byDay[d].q,0)/last3.length:0;
  R.best=sd.reduce((b,d)=>!b||R.byDay[d].r>R.byDay[b].r?d:b,null);
  return R;
}

/* ---------- Diagramme (SVG) ---------- */
function barChart(items,o={}){
  if(!items.length)return '<div class="hint">Noch keine Daten.</div>';
  const H=o.h||130,bw=o.bw||30,W=Math.max(300,items.length*bw+16),pad=32,col=o.color||'var(--link)';
  const max=Math.max(...items.map(i=>i.v),1);
  const bars=items.map((it,i)=>{
    const h=Math.max(0,(it.v/max)*(H-pad-4)),x=8+i*bw,y=H-h-14;
    return `<rect x="${x+3}" y="${y}" width="${bw-8}" height="${h}" rx="4" fill="${col}"/>
      <text class="val" x="${x+bw/2-1}" y="${y-3}" text-anchor="middle">${o.fmt?o.fmt(it.v):it.v}</text>
      <text x="${x+bw/2-1}" y="${H-2}" text-anchor="middle">${it.l}</text>`}).join('');
  return `<div class="scroll"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bars}</svg></div>`;
}
function lineChart(items,o={}){
  if(!items.length)return '<div class="hint">Noch keine Daten.</div>';
  const H=o.h||140,bw=o.bw||34,W=Math.max(300,items.length*bw+24),top=14,bot=18;
  const vs=items.map(i=>i.v),mx=Math.max(...vs,0),mn=Math.min(...vs,0),rng=(mx-mn)||1;
  const Y=v=>top+(mx-v)/rng*(H-top-bot),X=i=>16+i*bw;
  const pts=items.map((it,i)=>`${X(i)},${Y(it.v)}`).join(' ');
  const dots=items.map((it,i)=>`<circle cx="${X(i)}" cy="${Y(it.v)}" r="3.5" fill="${it.v<0?'var(--red)':'var(--green)'}"/>
    <text class="val" x="${X(i)}" y="${Y(it.v)-7}" text-anchor="middle">${it.v}</text>
    <text x="${X(i)}" y="${H-3}" text-anchor="middle">${it.l}</text>`).join('');
  return `<div class="scroll"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="4 3"/>
    <polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg></div>`;
}
function hbars(rows,fmt){
  if(!rows.length)return '<div class="hint">Noch keine Daten.</div>';

}

/* ---------- Drehrad ---------- */
const WH=40;
const wheelHtml=(id,min,max,val)=>`<div class="wcol"><div class="wheel" id="${id}" data-min="${min}" data-max="${max}" data-val="${val}">${Array.from({length:max-min+1},(_,i)=>`<div data-v="${min+i}">${min+i}</div>`).join('')}</div><i class="band"></i></div>`;
const wheelVal=el=>{const mn=+el.dataset.min,mx=+el.dataset.max;return Math.min(mx,Math.max(mn,mn+Math.round(el.scrollTop/WH)))};
function setWheel(el,v){el.scrollTop=(Math.min(+el.dataset.max,Math.max(+el.dataset.min,v))-el.dataset.min)*WH}
function updateAdd(){
  const wp=$('#wp'),wq=$('#wq'),b=$('#addX');if(!wp||!wq||!b||!wp.offsetParent)return;
  cur.wp=wheelVal(wp);cur.wq=wheelVal(wq);
  b.textContent=`${cur.wq} × ${eur(cur.wp)} hinzufügen (${eur(cur.wp*cur.wq)})`;
}
function initWheels(){
  document.querySelectorAll('.wheel').forEach(el=>{
    setWheel(el,+el.dataset.val);
    if(!el._i){el._i=1;el.addEventListener('scroll',updateAdd,{passive:true});
    el.addEventListener('click',ev=>{const d=ev.target.closest('[data-v]');if(d)el.scrollTo({top:(+d.dataset.v-el.dataset.min)*WH,behavior:'smooth'})})}
  });
  updateAdd();requestAnimationFrame(()=>{document.querySelectorAll('.wheel').forEach(el=>setWheel(el,+el.dataset.val));updateAdd()});
}

/* Schnell-Erfassung: Text -> Zeilen */
const normT=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss')
  .replace(/(\d)[.,](\d)\s*kg/g,'$1$2kg').replace(/[^a-z0-9€\s]/g,' ').replace(/\s+/g,' ').trim();
const tokMatch=(a,b)=>a===b||(a.length>=4&&b.length>=4&&Math.abs(a.length-b.length)<=2&&(a.startsWith(b)||b.startsWith(a)));
const ptoks=p=>normT(p.name).split(' ').filter(t=>t&&t!=='€');
const ALIAS={albastru:'blau',galben:'gelb',portocaliu:'orange',verde:'grun',mov:'lila',rosu:'rot',buchet:'handbund',buchete:'handbund',legatura:'handbund',schnittgrun:'handbund',schnittgruen:'handbund',bund:'handbund',bunde:'handbund',bunden:'handbund',buendel:'handbund',handbunde:'handbund',handbunden:'handbund',scheibe:'holzscheibe',scheiben:'holzscheibe',holzscheiben:'holzscheibe'};
const NOISE=['mal','x','stk','stuck','st','€','euro','eur','je','a','und','usw','etc','ca'];
function resolveItem(toks,pr,cnt,txt){
  toks=toks.map(t=>ALIAS[t]||t).filter((t,i,a)=>i===0||t!==a[i-1]);
  let cands=toks.length?S.products.filter(p=>{const pt=ptoks(p);return toks.every(t=>pt.some(b=>tokMatch(t,b)))}):[];
  let amb=false,pid='',freeHit=false;
  if(!toks.length&&pr!=null){const fr=S.products.find(p=>p.free);if(fr){cands=[fr];freeHit=true}}
  else if(pr!=null){const f=cands.filter(p=>Math.abs(p.price-pr)<0.005&&!p.free);if(f.length)cands=f;else{const fr=cands.filter(p=>p.free);if(fr.length){cands=fr;freeHit=true}}}
  cands.sort((a,b)=>ptoks(a).length-ptoks(b).length);
  if(cands.length){
    pid=cands[0].id;
    if(!freeHit&&cands.length>1&&ptoks(cands[1]).length===ptoks(cands[0]).length&&!(pr!=null&&cands.filter(p=>Math.abs(p.price-pr)<0.005).length===1))amb=true;
  }else amb=true;
  const p=prod(pid);
  return {txt,pid,price:pr!=null?pr:(p?p.price:0),count:cnt==null?1:cnt,amb};
}
/* Liste wie "10 blau 3 gelb 5 holzscheibe 4 bunde nobilis 4 41€ 3 25€" oder "Nordmann Blau 7, Handbunde 4" */
function parseText(text){
  let t=text.toLowerCase().replace(/(\d)[.,](\d)\s*kg/g,'$1$2kg')
    .replace(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur\b|euro\b)/g,(m,n)=>' §'+n.replace(',','.')+' ')
    .replace(/(\d+)\s*(?:x|×|mal|stk|stück|stueck)(?![a-zäöüß])/g,'$1 ').replace(/(^|\s)[x×]\s*(\d+)/g,'$1$2 ');
  const rows=[];
  t.split(/[\n;,]+/).forEach(chunk=>{
    const toks=[];
    chunk.split(/\s+/).filter(Boolean).forEach(raw=>{
      if(raw[0]==='§'){toks.push({k:'P',v:parseFloat(raw.slice(1))});return}
      normT(raw).split(' ').filter(Boolean).forEach(w=>{
        if(/^\d+$/.test(w))toks.push({k:'N',v:+w});
        else if(!NOISE.includes(w))toks.push({k:'W',v:w});
      });
    });
    const cf=toks.length&&toks[0].k==='N';
    const items=[];let cur=null;
    toks.forEach(tk=>{
      if(tk.k==='N'){if(cur&&cur.count==null)cur.count=tk.v;else{cur={count:tk.v,price:null,words:[]};items.push(cur)}}
      else if(tk.k==='P'){if(cur&&cur.price==null)cur.price=tk.v;else{cur={count:null,price:tk.v,words:[]};items.push(cur)}}
      else{if(cur&&(cf||cur.count==null))cur.words.push(tk.v);else{cur={count:null,price:null,words:[tk.v]};items.push(cur)}}
    });
    items.forEach(it=>rows.push(resolveItem(it.words,it.price,it.count,[it.count,it.words.join(' '),it.price!=null?it.price+' €':''].filter(x=>x!==null&&x!=='').join(' '))));
  });
  return rows;
}
function addExtra(pid,pr,qty){
  const e=entry(cur.stand,cur.date,true);
  const ex=e.extra.find(x=>x.pid===pid&&Math.abs(x.price-pr)<0.005);
  if(ex)ex.qty=exq(ex)+qty;else e.extra.push({id:uid(),pid,price:pr,qty});
}

  }
  if(t.parentElement&&t.parentElement.id==='nav'){if(tab===t.dataset.t&&tab==='zahlen')cur.zst=false;const inS=['staende','erfassen','zahlen'].includes(tab);tab=t.dataset.t;if(tab==='staende'&&!inS&&salesStarted()){tab=has('verkauf')?'erfassen':has('zahlen')?'zahlen':'staende'};window.scrollTo(0,0);return render()}
});

function wxAgg(list,start){
  const days={};
  list.forEach(h=>{const d=h.timestamp.slice(0,10);(days[d]=days[d]||[]).push(h)});
  return [0,1,2].map(i=>{
    const d=shiftDate(start,i),hs=days[d]||[];if(!hs.length)return {d};
    const t=hs.map(h=>h.temperature).filter(v=>v!=null);if(!t.length)return {d};
    const day=hs.filter(h=>{const hh=+h.timestamp.slice(11,13);return hh>=8&&hh<=18}),use=day.length?day:hs;
    const rain=hs.reduce((a,h)=>a+(h.precipitation||0),0);
    const pp=Math.max(0,...use.map(h=>h.precipitation_probability||0));
    const gust=Math.round(Math.max(0,...hs.map(h=>h.wind_gust_speed||h.wind_speed||0)));
    const has=c=>use.some(h=>h.condition===c);
    const cc=use.reduce((a,h)=>a+(h.cloud_cover||0),0)/use.length;
    let ic,txt;
    if(has('thunderstorm')){ic='⛈';txt='Gewitter'}
    else if(has('snow')||has('sleet')||has('hail')){ic='🌨';txt=has('snow')?'Schnee':has('sleet')?'Schneeregen':'Hagel'}
    else if(has('rain')||(rain>=2&&pp>=50)){ic='🌧';txt='Regen'}
    else if(has('fog')){ic='🌫';txt='Nebel'}
    else if(cc<25){ic='☀️';txt='Sonnig'}else if(cc<60){ic='⛅';txt='Teils bewölkt'}else{ic='☁️';txt='Bewölkt'}
    return {d,ic,txt,tmin:Math.round(Math.min(...t)),tmax:Math.round(Math.max(...t)),rain,pp,gust};
  });
}
async function loadWx(force){
  ensureStandCoords();

  wxBusy=(async()=>{
    try{
      const r=await fetch(`https://api.brightsky.dev/weather?lat=${loc.lat}&lon=${loc.lon}&date=${today}&last_date=${shiftDate(today,3)}&tz=Europe/Berlin`);
      if(!r.ok)throw new Error('HTTP '+r.status);

function askQuestion(){

  d.addEventListener('click',e=>{const x=e.target;
    if(x.dataset.ok){const txt=(d.querySelector('#q-text').value||'').trim();if(!txt)return alert('Bitte eine Frage eintragen.');
      S.questions.push({id:uid(),text:txt,by:S.me,byUid:S.myUid||'',created:Date.now(),done:false});save();
      d.innerHTML=`<div><p><b>Till, du bekommst so schnell wie möglich Rückmeldung.</b></p><button class="btn" data-no="1" style="padding:16px">Schließen</button></div>`}

function questionsBlock(){
  if(!isAdmin())return '';
  const qs=S.questions.filter(q=>!q.deleted),open=qs.filter(q=>!q.done).sort((a,b)=>(b.created||0)-(a.created||0)),done=qs.filter(q=>q.done).sort((a,b)=>(b.created||0)-(a.created||0));
  if(!qs.length)return '';
  const when=q=>new Date(q.created||Date.now()).toLocaleString(LOC,{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
  const card=(q,fin)=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><div class="n">${esc(q.by||'?')}</div><span class="p">${when(q)}</span></div><div style="margin-top:4px">${esc(q.text)}</div>${fin?'':`<button class="btn sec" data-pl="qdone" data-v="${q.id}" style="margin:8px 0 0;width:auto;padding:8px 14px">Beantwortet</button>`}</div>`;
  return `<h2>Fragen zur App${open.length?' ('+open.length+')':''}</h2>${open.length?`<div class="card">${open.map(q=>card(q,false)).join('')}</div>`:'<div class="hint">Keine offenen Fragen.</div>'}${done.length?`<details data-det="qdone"><summary>Beantwortet (${done.length})</summary><div class="card">${done.map(q=>card(q,true)).join('')}</div></details>`:''}`;
}
function completeTask(id){
  const td=todayStr(),x=S.tasks.find(x=>x.id===id);if(!x)return;
  x.done=!x.done;
  if(x.reportId){const rp=S.reports.find(r=>r.id===x.reportId);if(rp){rp.status=x.done?'erledigt':'arbeit';if(x.done){rp.doneAt=Date.now();rp.doneBy=S.me}else{delete rp.doneAt;delete rp.doneBy}}}
  if(x.done){
    x.doneBy=S.me;x.doneAt=Date.now();
    S.cheered=S.cheered||{};
    if(beerStat().pct>=0.8&&S.cheered[S.me]!==td){S.cheered[S.me]=td;save();render();return showCheers()}
  }else{delete x.doneBy;delete x.doneAt;S.cheered=S.cheered||{};if(beerStat().pct<0.8)delete S.cheered[S.me]}
  save();render();
}

const canHof=()=>has('lieferungen')||has('lieferplanung');
function calItems(ct,ds){

    ...S.events.filter(e=>!e.deleted&&e.cal==='saison'&&e.person===S.me&&e.date<=ds&&ds<=(e.end||e.date)).map(o=>({k:'ev',o}))];
  if(ct==='hof')return S.tours.filter(t=>!t.deleted&&t.date===ds).map(o=>({k:o.type==='abholung'?'pick':'tour',o}));
  return S.events.filter(e=>!e.deleted&&e.cal===ct&&e.date<=ds&&ds<=(e.end||e.date)).map(o=>({k:'ev',o}));

function planKal(){
  const ct=(cur.ctab==='hof'&&!canHof())?'saison':cur.ctab,[y,m]=cur.cal.split('-').map(Number),td=todayStr();
  const off=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate();
  const kwOf=ds=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)};
  const chipOf=it=>{const o=it.o;
    if(it.k==='task')return `<i class="c-x">${esc(o.title)}</i>`;
    if(it.k==='tour')return `<i class="c-t" style="border-color:${tcol(o)}">${esc(tourName(o))}</i>`;
    if(it.k==='pick')return `<i class="c-o">${esc(tourStops(o).map(x=>x.name).join(', ')||'Abholung')}</i>`;
    const c=ct==='insta'?({idee:'c-x',bereit:'',gepostet:'c-g'}[o.status]||''):(ct==='meine'?'c-v':'');
    return `<i class="${c}">${esc(o.title)}</i>`};
  const monGrid=()=>{
    const first=`${y}-${p2(m)}-01`,start=shiftDate(first,-off),rows=Math.ceil((off+dim)/7);let g='<u></u>'+WDS.map(x=>`<u>${x}</u>`).join('');
    for(let r=0;r<rows;r++){
      g+=`<div class="kw"><span>KW ${kwOf(shiftDate(start,r*7))}</span></div>`;
      for(let c=0;c<7;c++){const ds=shiftDate(start,r*7+c),its=calItems(ct,ds),inM=ds.slice(0,7)===cur.cal.slice(0,7);
        g+=`<button class="md ${inM?'':'out'} ${ds===cur.cday?'sel':''} ${ds===td?'today':''}" data-pl="cday" data-v="${ds}"><b>${+ds.slice(8)}</b>${its.slice(0,3).map(chipOf).join('')}${its.length>3?`<em class="more">+${its.length-3}</em>`:''}</button>`}
    }
    return `<div class="mcal">${g}</div>`};
  const chips=`<div class="seg">${[['saison','Saison'],has('instagram')?['insta','Instagram']:null,['meine','Meine'],canHof()?['hof','Hof']:null].filter(Boolean).map(([k,l])=>`<button class="${ct===k?'on':''}" data-pl="ctab" data-v="${k}">${l}</button>`).join('')}</div>`;
  const mname=new Date(y,m-1,1).toLocaleDateString(LOC,{month:'long',year:'numeric'});
  const empty=t=>`<div class="row"><span class="p">${t}</span></div>`;
  const its=calItems(ct,cur.cday);
  const addBtn=ct==='hof'?'':ct==='meine'?`<button class="btn add" data-pl="dtaskd" style="margin:4px 0 14px">+ Aufgabe für diesen Tag</button>`:canCal()?`<button class="btn add" data-pl="enew" style="margin:4px 0 14px">${ct==='insta'?'+ Beitrag':'+ Termin'} für diesen Tag</button>`:'<div class="hint">Dieser Kalender wird vom Chef und vom Admin gepflegt.</div>';
  const head=`<section class="blk" style="padding-bottom:14px"><div class="calhead" style="margin-top:2px"><button data-pl="cmon" data-v="-1">‹</button><b>${mname}</b><button data-pl="cmon" data-v="1">›</button></div>${monGrid()}</section>`;
  const day=blk(wdD(cur.cday),calDay(ct,cur.cday)||empty(ct==='meine'?'Nichts für dich an diesem Tag.':ct==='hof'?'Keine Touren oder Abholungen an diesem Tag.':'Für diesen Tag ist nichts eingetragen.'),{pill:its.length?pill(its.length):''});
  return chips+head+day+addBtn;
}
function planAufg(){

  const keep=t=>!pfl||(pfl==='@me'?t.person===S.me:pfl==='@open'?!t.person:t.person===pfl);
  const list=S.tasks.filter(t=>!t.deleted&&keep(t)&&(seeAllTasks()||!t.person||t.person===S.me)),open=list.filter(t=>!t.done);
  const srt=a=>a.slice().sort((x,y)=>((x.date||'9')+(x.time||''))<((y.date||'9')+(y.time||''))?-1:1);
  const groups=[['Überfällig',open.filter(t=>t.date&&t.date<td),'r'],['Heute',open.filter(t=>t.date===td),'o'],['Demnächst',open.filter(t=>t.date>td),''],['Ohne Datum',open.filter(t=>!t.date),'']];
  const fl=[['','Alle'],['@me','Meine'],['@open','Offen']].concat(seeAllTasks()?S.people.map(p=>[p,p]):[]);
  const nDone=list.filter(t=>t.done).length;

  ${groups.map(([n,a,c])=>a.length?blk(n,srt(a).map(t=>taskRow(t,true)).join(''),{tone:c==='r'?'r':c==='o'?'o':'',pill:pill(a.length,c)}):'').join('')}
  ${!open.length?'<div class="blk"><div class="row"><span class="p">Nichts offen.</span></div></div>':''}

}
function planArch(){
  const adm=isAdmin(),pf=adm?cur.af:'',st=cur.ast||'alle';
  let src=S.tasks.filter(t=>(t.done||t.deleted)&&(adm||t.person===S.me||t.doneBy===S.me||(t.createdBy===S.me&&!t.person)));
  if(pf==='@open')src=src.filter(t=>!t.person);else if(pf)src=src.filter(t=>t.person===pf||t.doneBy===pf);
  const rows=src.map(t=>({t,del:!!t.deleted,at:t.deleted?(t.deletedAt||0):(t.doneAt||0)}));
  const nE=rows.filter(r=>!r.del).length,nG=rows.filter(r=>r.del).length;
  const list=rows.filter(r=>st==='alle'||(st==='erledigt'?!r.del:r.del)).sort((a,b)=>b.at-a.at);
  const lim=cur.alim||60,shown=list.slice(0,lim);

  const row=({t,del,at})=>`<div class="row"><div style="display:flex;gap:10px;align-items:center;min-width:0;flex:1">${del?'<span class="chk del" aria-hidden="true">×</span>':`<button class="chk on" data-pl="tdone" data-v="${t.id}">✓</button>`}
    <div style="min-width:0;flex:1"><div class="n done">${esc(t.title)}</div><div class="p">${t.person?'<span class="who">'+esc(t.person)+'</span> · ':''}${del?'Gelöscht von '+esc(t.deletedBy||'?'):'Erledigt'+(t.doneBy&&t.doneBy!==t.person?' von '+esc(t.doneBy):'')}${at?' am '+dstr(at):''}</div></div></div>${t.photo?thumbBtn(t.photo,'sdopen',t.id):''}${del&&has('archiv')?`<button class="claim" data-pl="restore" data-v="task:${t.id}">Wiederherstellen</button>`:''}</div>`;
  const seg=`<div class="seg">${[['alle','Alle ('+rows.length+')'],['erledigt','Erledigt ('+nE+')'],['geloescht','Gelöscht ('+nG+')']].map(([k,l])=>`<button class="${st===k?'on':''}" data-pl="ast" data-v="${k}">${l}</button>`).join('')}</div>`;
  const ppl=adm?`<div class="chips">${[['','Alle'],['@open','Ohne Person']].concat(S.people.map(p=>[p,p])).map(([v,l])=>`<button class="chip ${pf===v?'on':''}" data-pl="af" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>`:'';
  return `<h2 style="margin-top:4px">Aufgabenarchiv</h2><div class="hint" style="margin-top:-4px">${adm?'Alle erledigten und gelöschten Aufgaben, nach Mitarbeiter filterbar.':'Deine erledigten und gelöschten Aufgaben.'}</div>${seg}${ppl}
  ${blk(adm&&pf&&pf!=='@open'?esc(pf):'Archiv',shown.map(row).join('')||'<div class="row"><span class="p">Nichts im Archiv.</span></div>',{pill:pill(list.length)})}
  ${list.length>lim?'<button class="btn sec" data-pl="amore">Mehr anzeigen</button>':''}`;
}

document.addEventListener('click',ev=>{

    const n=($('#reg-name').value||'').trim().replace(/\s+/g,' ');
    if(!n)return alert('Bitte einen Benutzernamen eingeben.');
    if(S.people.some(p=>p.toLowerCase()===n.toLowerCase()))return alert('Diesen Namen gibt es schon.');

/* ---------- Dashboard pro Stand ---------- */
function kvList(a){
  const s=a;
  const row=(l,v,c,hl)=>`<div class="kv ${hl?'hl':''}"><span>${l}</span><span class="${c||''}">${v}</span></div>`;
  return `<div class="card">
    ${row('Soll-Bestand',num(s.soll)+' Stk.',s.soll<0?'neg':'',1)}
    ${row('Verkäufe',num(s.verk)+' Stk.')}
    ${row('Umsatz',eur0(s.umsatz))}
    ${row('Gewinn',eur0(s.gewinn),s.gewinn<0?'neg':'pos',1)}
    ${row('Retouren',num(s.ret)+' Stk.')}
    ${row('Lieferung',num(s.lief)+' Stk.')}
    ${row('Produktionskosten',eur0(s.pcost))}
    ${row('Standgebühren',eur0(s.fee))}
    ${row('Personalkosten',eur0(s.staff))}
    ${row('Auf-/Abbaukosten',eur0(s.setup))}
    ${row('Lieferkosten',eur0(s.freight))}
    ${row('Ist-Bestand',s.ist==null?'–':num(s.ist)+' Stk.')}
    ${row('Differenz (Ist − Soll)',s.diff==null?'–':num(s.diff)+' Stk.',s.diff==null?'':s.diff<0?'neg':'')}
  </div>`;
}
function insights(a){
  const out=[];
  if(a.avg)out.push(['Ø Verkäufe pro Verkaufstag',a.avg.toLocaleString(LOC,{maximumFractionDigits:1})+' Stk.']);
  if(a.verk)out.push(['Ø Preis pro Baum',eur(a.umsatz/a.verk)]);
  if(a.verk)out.push(['Ø Gewinn pro Baum (nach allen Kosten)',eur(a.gewinn/a.verk)]);
  if(a.best)out.push(['Bester Tag',shortD(a.best)+' · '+eur0(a.byDay[a.best].r)]);
  if(a.avg3&&a.soll>0)out.push(['Bestand reicht noch ca.',(a.soll/a.avg3).toLocaleString(LOC,{maximumFractionDigits:1})+' Tage (Ø letzte 3 Tage)']);
  if(a.fixed>0&&a.verk>0&&a.umsatz>a.pcost){const mg=(a.umsatz-a.pcost)/a.verk,m=(a.fixed-(a.umsatz-a.pcost))/mg;out.push(['Gewinnschwelle',m<=0?'erreicht':'noch ca. '+Math.ceil(m)+' Bäume'])}
  return out.length?`<div class="card">${out.map(([l,v])=>`<div class="kv"><span>${l}</span><span>${v}</span></div>`).join('')}</div>`:'';
}
function prodChart(a){
  const rows=Object.entries(a.byProd).map(([id,q])=>({l:pname(id),v:q})).sort((x,y)=>y.v-x.v).slice(0,12);
  return hbars(rows,v=>v+' Stk.');
}

function vLieferungen(){
  const td=todayStr(),plan=has('lieferplanung');

  const live=S.tours.filter(t=>!t.deleted&&(kind==='ges'||(kind==='abh')===isP(t))&&(!fahrer||t.driver===S.me||t.codriver===S.me));

  const nL=ds=>on(ds).filter(t=>!isP(t)).reduce((s,t)=>s+nOf(t),0),nA=ds=>on(ds).filter(isP).reduce((s,t)=>s+nOf(t),0);
  const badge=ds=>{const l=nL(ds),a=nA(ds);return (l&&kind!=='abh'?`<i class="c-t" style="text-align:center;font-size:13px;font-weight:700">${l}</i>`:'')+(a&&kind!=='lief'?`<i class="c-o" style="text-align:center;font-size:13px;font-weight:700">${a}</i>`:'')};

  const off=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate(),rows=Math.ceil((off+dim)/7),first=`${y}-${p2(m)}-01`,start=shiftDate(first,-off);
  const kwOf=ds=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)};

function download(name,type,content){
  const blob=new Blob([content],{type});
  const file=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>1);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}
function csv(){
  const L=['Datum;Stand;Typ;Produkt;Anzahl;Preis;Umsatz;Ist-Bestand;Notiz'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""').replace(/\n/g,' ')+'"';
  const nf=n=>String(n).replace('.',',');
  const sn=sid=>{const s=S.stands.find(x=>x.id===sid);return q(s?s.name:standNm(sid)||sid)};
  Object.keys(S.entries).sort().forEach(k=>{
    const [sid,d]=k.split('|'),e=entry(sid,d);let first=true;
    const tail=()=>{const r=first?[e.rest,q(e.note)]:['',''];first=false;return r};
    S.products.filter(p=>+e.counts[p.id]>0).forEach(p=>L.push([d,sn(sid),'Verkauf',q(p.name),e.counts[p.id],nf(price(e,p)),nf(e.counts[p.id]*price(e,p)),...tail()].join(';')));
    e.extra.forEach(x=>L.push([d,sn(sid),'Verkauf (Einzelpreis)',q(pname(x.pid)),exq(x),nf(x.price),nf(x.price*exq(x)),...tail()].join(';')));
    if(first&&(e.rest!==''||e.note))L.push([d,sn(sid),'Tagesnotiz','',0,'',0,e.rest,q(e.note)].join(';'));
  });
  S.moves.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(m=>L.push([m.date,sn(m.stand),m.type==='L'?'Lieferung':'Retoure','',m.qty,'','','',''].join(';')));
  return '﻿'+L.join('\r\n');
}

/* ---------- Sprache: Übersetzung der Oberfläche (Deutsch / Rumänisch) ---------- */
const RO=window.RO_DICT||{},ROP=window.RO_PATTERNS||[];
function trs(str){
  if(LANG!=='ro'||!str)return str;
  const k=str.trim();if(!k)return str;
  let r=RO[k];
  if(r===undefined)for(const [re,fn] of ROP){const m=k.match(re);if(m){r=fn(...m);break}}
  return r===undefined?str:str.replace(k,()=>r);
}
function i18nTree(n){
  if(LANG!=='ro'||!n)return;
  if(n.nodeType===3){const v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1)return;
  for(const a of ['placeholder','title','aria-label','alt']){if(n.hasAttribute(a)){const v=trs(n.getAttribute(a));if(v!==n.getAttribute(a))n.setAttribute(a,v)}}
  if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName))return;
  n.childNodes.forEach(i18nTree);
}
if(LANG==='ro'){
  const _al=window.alert.bind(window),_cf=window.confirm.bind(window);
  window.alert=m=>_al(trs(String(m)));window.confirm=m=>_cf(trs(String(m)));const _pr=window.prompt.bind(window);window.prompt=(m,d)=>_pr(trs(String(m)),d);
  new MutationObserver(ms=>ms.forEach(m=>{m.addedNodes.forEach(i18nTree);if(m.type==='characterData')i18nTree(m.target)})).observe(document.body,{childList:true,subtree:true,characterData:true});
}

render();
if(LANG==='ro')i18nTree(document.body);
